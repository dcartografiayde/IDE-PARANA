<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Red y Área de Influencia</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Turf.js para operaciones geoespaciales (Unión de polígonos) -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
    body, html {
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- FlatGeobuf JS -->
  <script src="https://unpkg.com/flatgeobuf@3.24.0/dist/flatgeobuf-geojson.min.js"></script>

  <script>
    // Inicialización del Mapa
    const map = L.map('map').setView([-34.6037, -58.3816], 12);

    // Capa Base
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Estilo para el área de influencia
    const estiloAreaInfluencia = {
      color: "#ff7800",
      stroke: false,      // MODIFICACIÓN: Se elimina el borde externo/línea
      weight: 0,          // MODIFICACIÓN: Grosor de borde en 0
      fillColor: "#ff7800",
      fillOpacity: 0.35
    };

    // Estilo para la red
    const estiloRed = {
      color: "#0055ff",
      weight: 3,
      opacity: 0.8
    };

    // Creación de capas GeoJSON
    const layerAreaInfluencia = L.geoJson(null, { style: estiloAreaInfluencia }).addTo(map);
    const layerRed = L.geoJson(null, { style: estiloRed }).addTo(map);

    // Control de Capas
    // MODIFICACIÓN: Nombres simplificados sin aclaraciones de "FGB" ni "200 metros"
    const capasSuperpuestas = {
      "Área de influencia": layerAreaInfluencia, // MODIFICACIÓN: Nombre limpio
      "Red": layerRed                           // MODIFICACIÓN: Nombre limpio
    };

    L.control.layers(null, capasSuperpuestas, { collapsed: false }).addTo(map);

    // Carga del Área de Influencia con FlatGeobuf y Unión de geometrías
    async function cargarAreaInfluencia() {
      try {
        const response = await fetch('area_influencia.fgb');
        const features = [];

        for await (const feature of flatgeobuf.deserialize(response.body)) {
          features.push(feature);
        }

        // MODIFICACIÓN: Se disuelven/unen las áreas coincidentes para que formen una sola geometría
        if (features.length > 0) {
          let areaUnificada = features[0];
          for (let i = 1; i < features.length; i++) {
            areaUnificada = turf.union(areaUnificada, features[i]);
          }
          layerAreaInfluencia.addData(areaUnificada);
        }
      } catch (error) {
        console.error("Error al cargar el área de influencia:", error);
      }
    }

    // Carga de la Red con FlatGeobuf
    async function cargarRed() {
      try {
        const response = await fetch('red.fgb');
        for await (const feature of flatgeobuf.deserialize(response.body)) {
          layerRed.addData(feature);
        }
      } catch (error) {
        console.error("Error al cargar la red:", error);
      }
    }

    // Ejecución de cargas
    cargarAreaInfluencia();
    cargarRed();
  </script>
</body>
</html>
