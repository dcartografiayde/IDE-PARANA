<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Visor Paraná - Vecinales, Calles y Parcelas con IA</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Librerías para conversión de coordenadas (EPSG:22185 -> WGS84) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.1/proj4leaflet.min.js"></script>
<!-- Plugin para nombres de calles -->
<script src="https://cdn.jsdelivr.net/npm/leaflet-textpath@1.2.3/leaflet.textpath.min.js"></script>
<!-- Plugin para búsqueda por dirección (Geocoder) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<style>
body { margin:0; padding:0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
#map { height: 100vh; width: 100%; background:#001a33; }

.panel-superior {
    position:absolute; top:15px; left:60px; z-index:2000;
    background:rgba(255, 255, 255, 0.95); padding:12px; border-radius:8px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    display:flex; gap:10px; flex-wrap: wrap;
    max-width: 85vw;
}

.contenedor-busqueda { position: relative; display: inline-block; }
.input-busqueda { padding:8px; border: 1px solid #ccc; border-radius: 4px; min-width: 160px; }
.btn-busqueda { padding:8px 15px; cursor: pointer; background: #2c3e50; color: white; border: none; border-radius: 4px; font-weight: bold; }
.btn-busqueda:hover { background: #34495e; }

/* Estilos IA */
.btn-ia { background: #8e44ad; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 8px; display: block; width: 100%; font-weight: bold; }
.btn-ia:hover { background: #9b59b6; }
.ia-response { 
    margin-top: 10px; 
    padding: 10px; 
    background: #f4f4f9; 
    border-left: 4px solid #8e44ad; 
    font-size: 13px; 
    max-height: 200px; 
    overflow-y: auto;
    color: #333;
}
.loading-ia { font-style: italic; color: #777; }

/* Estilos para el autocompletado */
.sugerencias-lista {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #ccc;
    border-top: none;
    z-index: 3000;
    max-height: 200px;
    overflow-y: auto;
    border-radius: 0 0 4px 4px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    display: none;
}
.sugerencia-item {
    padding: 8px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 1px solid #eee;
}
.sugerencia-item:hover { background-color: #f0f0f0; }

.etiqueta-vecinal {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    font-size: 11px !important;
    font-weight: 900 !important;
    color: #333 !important;
    text-shadow: 2px 2px 2px #fff, -2px -2px 2px #fff, 2px -2px 2px #fff, -2px 2px 2px #fff !important;
    text-transform: uppercase;
    text-align: center;
    pointer-events: none;
    white-space: normal !important;
    width: 120px !important;
    display: block;
    line-height: 1.1;
    transition: opacity 0.3s;
}

#asistente-ia-panel {
    border-left: 2px solid #ddd;
    padding-left: 10px;
    display: flex;
    gap: 5px;
}
</style>
</head>

<body>

<div class="panel-superior">
    <div class="contenedor-busqueda">
        <input type="text" id="input-pm" class="input-busqueda" placeholder="Partida Municipal">
        <button onclick="buscarPM()" class="btn-busqueda">Buscar Parcela</button>
    </div>
    
    <div class="contenedor-busqueda">
        <input type="text" id="input-vecinal" class="input-busqueda" placeholder="Nombre Vecinal..." autocomplete="off">
        <div id="lista-sugerencias" class="sugerencias-lista"></div>
        <button onclick="buscarVecinal()" class="btn-busqueda">Buscar Vecinal</button>
    </div>

    <div id="asistente-ia-panel">
        <input type="text" id="prompt-ia" class="input-busqueda" placeholder="Pregunta a la IA sobre Paraná...">
        <button onclick="preguntarIA()" class="btn-busqueda" style="background:#8e44ad">✨ Consultar</button>
    </div>
</div>

<div id="map"></div>

<script>
// API Gemini Config
const apiKey = ""; // Se inyecta automáticamente en el entorno

// Configuración de Proyección POSGAR 94 / Argentina 5 (EPSG:22185)
proj4.defs("EPSG:22185","+proj=tmerc +lat_0=-90 +lon_0=-60 +k=1 +x_0=5500000 +y_0=0 +ellps=intl +towgs84=-148,136,90,0,0,0,0 +units=m +no_defs");

const REPO_ROOT = "https://raw.githubusercontent.com/dcartografiayde/IDE-PARANA/main/";
const VERSION = "?v=" + Date.now();

var map = L.map('map',{
    center:[-31.74, -60.52],
    zoom:13, 
});

/* Capas Base */
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
var ref = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}');
var hibrido = L.layerGroup([sat, ref]).addTo(map);

/* Grupos de Capas */
var grupoVecinales = L.layerGroup().addTo(map);
var grupoCalles = L.layerGroup(); 
var grupoParcelas = L.layerGroup(); 

var lyVecinales;
var parcelasLayers = [];
var capasCalles = [];
var nombresVecinales = [];

/* --- INTEGRACIÓN GEMINI API --- */

async function llamarGemini(prompt) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
    
    const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: "Eres un historiador y urbanista experto en la ciudad de Paraná, Entre Ríos, Argentina. Proporcionas información precisa, amable y culturalmente relevante." }] }
    };

    let retries = 0;
    const maxRetries = 5;
    
    while (retries < maxRetries) {
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error('API Error');
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text;
        } catch (e) {
            retries++;
            await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
        }
    }
    return "Lo siento, no pude obtener una respuesta de la IA en este momento.";
}

async function generarPerfilBarrio(nombreVecinal, elementoId) {
    const container = document.getElementById(elementoId);
    container.innerHTML = '<span class="loading-ia">✨ Analizando barrio...</span>';
    
    const prompt = `Proporciona una breve descripción histórica y características principales de la zona de la Vecinal "${nombreVecinal}" en Paraná, Entre Ríos. Menciona posibles puntos de interés o su ubicación general en la ciudad. Sé conciso (máximo 120 palabras).`;
    
    const respuesta = await llamarGemini(prompt);
    container.innerHTML = respuesta;
}

async function preguntarIA() {
    const promptInput = document.getElementById('prompt-ia');
    const pregunta = promptInput.value;
    if (!pregunta) return;

    // Crear un modal simple para la respuesta de IA global
    const responseText = await llamarGemini(pregunta);
    
    const modalDiv = document.createElement('div');
    modalDiv.style = "position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:20px; z-index:10000; border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,0.5); max-width:500px; width:90%;";
    modalDiv.innerHTML = `
        <h3 style="margin-top:0; color:#8e44ad">✨ Asistente Urbanístico</h3>
        <p style="font-size:14px; line-height:1.5">${responseText.replace(/\n/g, '<br>')}</p>
        <button onclick="this.parentElement.remove()" class="btn-busqueda" style="width:100%">Cerrar</button>
    `;
    document.body.appendChild(modalDiv);
    promptInput.value = '';
}

/* --- UTILIDADES --- */
function getColor(texto) {
    if (!texto) return '#7f8c8d';
    const colores = ['#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#fabed4', '#469990', '#dcbeff', '#9A6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#a9a9a9'];
    let hash = 0;
    for (let i = 0; i < texto.length; i++) { hash = texto.charCodeAt(i) + ((hash << 5) - hash); }
    return colores[Math.abs(hash) % colores.length];
}

function transformarCoordenadas(data) {
    data.features.forEach(f => {
        const transform = ring => ring.map(c => proj4("EPSG:22185", "WGS84", c));
        if (f.geometry.type === "Polygon") f.geometry.coordinates = f.geometry.coordinates.map(transform);
        if (f.geometry.type === "MultiPolygon") f.geometry.coordinates = f.geometry.coordinates.map(poly => poly.map(transform));
    });
    return data;
}

function formatearNombreMultilinea(texto, limite = 18) {
    if (!texto || texto.length <= limite) return texto;
    let palabras = texto.split(" "), lineas = [""], i = 0;
    palabras.forEach(p => {
        if ((lineas[i] + p).length > limite) { i++; lineas[i] = p; }
        else { lineas[i] += (lineas[i] === "" ? "" : " ") + p; }
    });
    return lineas.join("<br>");
}

/* --- LÓGICA VECINALES --- */
async function cargarVecinales() {
    try {
        const r = await fetch(REPO_ROOT + "backdoor/vecinales/vecinal.geojson" + VERSION);
        let data = await r.json();
        data = transformarCoordenadas(data);
        
        nombresVecinales = [];

        lyVecinales = L.geoJSON(data, {
            style: (f) => {
                const colorBarrio = getColor(f.properties.nombre || f.properties.NOM_VECINAL || "");
                return { 
                    color: colorBarrio, 
                    weight: 3, 
                    fillColor: colorBarrio, 
                    fillOpacity: 0.25 
                };
            },
            onEachFeature: (f, l) => {
                let nom = f.properties.nombre || f.properties.NOM_VECINAL || "Vecinal";
                if (!nombresVecinales.includes(nom)) nombresVecinales.push(nom);

                const iaId = "ia-vec-" + Math.random().toString(36).substr(2, 9);
                
                let popupContent = `
                    <div style="min-width:200px">
                        <b>Vecinal: ${nom}</b>
                        <button class="btn-ia" onclick="generarPerfilBarrio('${nom}', '${iaId}')">✨ Ver Perfil Histórico</button>
                        <div id="${iaId}" class="ia-response">Haz clic para descubrir la historia de este barrio.</div>
                    </div>
                `;
                l.bindPopup(popupContent);
                l.bindTooltip(formatearNombreMultilinea(nom), { 
                    permanent: true, 
                    direction: 'center', 
                    className: 'etiqueta-vecinal' 
                });
            }
        }).addTo(grupoVecinales);
        
        nombresVecinales.sort();
        configurarAutocompletado();
        actualizarVisibilidadCapas();
    } catch (e) { console.error("Error Vecinales:", e); }
}

/* --- LÓGICA DINÁMICA DE ZOOM --- */
function actualizarVisibilidadCapas() {
    const z = map.getZoom();
    document.querySelectorAll('.etiqueta-vecinal').forEach(el => {
        el.style.opacity = (z >= 15) ? "1" : "0";
    });
    if (z >= 16) {
        if (!map.hasLayer(grupoParcelas)) map.addLayer(grupoParcelas);
        if (!map.hasLayer(grupoCalles)) map.addLayer(grupoCalles);
        actualizarNombresCalles();
    } else {
        if (map.hasLayer(grupoCalles)) map.removeLayer(grupoCalles);
        if (map.hasLayer(grupoParcelas)) map.removeLayer(grupoParcelas);
    }
    if (lyVecinales) {
        if (z >= 16) lyVecinales.bringToBack();
        else lyVecinales.bringToFront();
    }
}

/* --- LÓGICA CALLES --- */
async function cargarCalles() {
    try {
        const r = await fetch(REPO_ROOT + "calles.geojson" + VERSION);
        const data = await r.json();
        L.geoJSON(data, {
            style: { color: "#333", weight: 2, opacity: 0.15 },
            onEachFeature: (f, l) => {
                if (f.properties.nombre && l instanceof L.Polyline) {
                    capasCalles.push({ layer: l, nombre: f.properties.nombre });
                }
            }
        }).addTo(grupoCalles);
    } catch (e) { console.error("Error Calles:", e); }
}

function actualizarNombresCalles() {
    const z = map.getZoom();
    if (z < 16) return;
    const bounds = map.getBounds();
    capasCalles.forEach(item => {
        if (bounds.intersects(item.layer.getBounds())) {
            if (!item.layer._text) {
                item.layer.setText(item.nombre, {
                    repeat: false, center: true, offset: 0, orientation: 'flip',
                    attributes: { 
                        fill: '#00FFFF', 
                        'font-size': z >= 18 ? '15' : '12', 
                        'font-weight': '900', 
                        'text-shadow': '1px 1px 2px #000' 
                    }
                });
            }
        } else if (item.layer._text) { item.layer.setText(null); }
    });
}

/* --- LÓGICA PARCELAS --- */
async function cargarParcelas() {
    const archivos = ["parcela1_4.geojson", "parcela5_7.geojson", "parcela8_15.geojson"];
    archivos.forEach(async (file) => {
        try {
            const r = await fetch(REPO_ROOT + file + VERSION);
            const data = await r.json();
            var grupos = {};
            data.features.forEach(f => {
                var key = JSON.stringify(f.geometry.coordinates);
                if(!grupos[key]) grupos[key] = [];
                grupos[key].push(f);
            });
            var featuresAgrupadas = Object.values(grupos).map(grupo => {
                var base = grupo[0];
                return {
                    type: "Feature",
                    geometry: base.geometry,
                    properties: {
                        esPH: grupo.length > 1,
                        partidas: grupo.map(g => g.properties.nropasd),
                        ubicacion: base.properties.ubipar1
                    }
                };
            });
            const ly = L.geoJSON(featuresAgrupadas, {
                style: (f) => ({
                    color: f.properties.esPH ? "#8e44ad" : "#2980b9",
                    weight: f.properties.esPH ? 1.5 : 0.6,
                    fillOpacity: f.properties.esPH ? 0.2 : 0.1
                }),
                onEachFeature: (f, l) => {
                    var content = f.properties.esPH ? 
                        "<b>Propiedad Horizontal</b><br><b>Partidas:</b><br>" + f.properties.partidas.join("<br>") :
                        "<b>Parcela</b><br><b>N° Partida:</b> "+(f.properties.partidas[0] || "-");
                    l.bindPopup(content + "<br><b>Ubicación:</b> "+(f.properties.ubicacion || "-"));
                }
            });
            parcelasLayers.push(ly);
            grupoParcelas.addLayer(ly);
        } catch (e) { }
    });
}

/* --- BUSCADORES Y AUTOCOMPLETADO --- */
function configurarAutocompletado() {
    const input = document.getElementById('input-vecinal');
    const lista = document.getElementById('lista-sugerencias');
    input.addEventListener('input', function() {
        const valor = this.value.toLowerCase().trim();
        lista.innerHTML = '';
        if (!valor) { lista.style.display = 'none'; return; }
        const filtrados = nombresVecinales.filter(n => n.toLowerCase().startsWith(valor));
        if (filtrados.length > 0) {
            filtrados.forEach(nombre => {
                const item = document.createElement('div');
                item.className = 'sugerencia-item';
                item.textContent = nombre;
                item.onclick = function() {
                    input.value = nombre;
                    lista.style.display = 'none';
                    buscarVecinal();
                };
                lista.appendChild(item);
            });
            lista.style.display = 'block';
        } else { lista.style.display = 'none'; }
    });
    document.addEventListener('click', (e) => {
        if (e.target !== input) lista.style.display = 'none';
    });
}

function buscarVecinal() {
    let t = document.getElementById('input-vecinal').value.toLowerCase().trim();
    if (!lyVecinales || !t) return;
    lyVecinales.eachLayer(l => {
        let n = (l.feature.properties.nombre || l.feature.properties.NOM_VECINAL || "").toLowerCase();
        if (n === t || n.startsWith(t)) {
            map.fitBounds(l.getBounds());
            l.openPopup();
        }
    });
}

function buscarPM() {
    let v = document.getElementById('input-pm').value.trim();
    parcelasLayers.forEach(ly => {
        ly.eachLayer(l => {
            if ((l.feature.properties.partidas || []).map(String).includes(v)) {
                map.setView(l.getBounds().getCenter(), 18);
                setTimeout(() => { l.openPopup(); }, 500);
            }
        });
    });
}

L.Control.geocoder({ defaultMarkGeocode: true, placeholder: "Buscar dirección...", title: "Búsqueda de Google" }).addTo(map);

cargarVecinales();
cargarCalles();
cargarParcelas();

map.on('zoomend', actualizarVisibilidadCapas);
map.on('moveend', actualizarNombresCalles);

L.control.layers(
    {"Híbrido": hibrido, "Calles (OSM)": osm}, 
    {"Vecinales": grupoVecinales, "Parcelas": grupoParcelas, "Calles Detalle": grupoCalles}
).addTo(map);

</script>
</body>
</html>
