<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Urbano Paraná - IDE Completo</title>

    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Plugins adicionales -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-textpath@1.2.3/leaflet.textpath.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin:0; padding:0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #001a33; }
        #map { height: 100vh; width: 100%; }

        /* Panel Superior */
        .panel-superior {
            position:absolute; top:15px; left:60px; z-index:2000;
            background: rgba(255, 255, 255, 0.95); padding:12px; border-radius:12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display:flex; gap:10px; align-items: center; flex-wrap: wrap;
            backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3);
        }

        input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; }
        .btn-buscar { background: #2980b9; color: white; padding: 8px 15px; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-buscar:hover { background: #1f6391; }
        
        /* Sugerencias Calles */
        #sugerencias-calles {
            position: absolute; background: white; border: 1px solid #ccc;
            border-radius: 4px; max-height: 200px; overflow-y: auto; z-index: 3000;
            width: 180px; display: none; margin-top: 38px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .sugerencia-item { padding: 8px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #eee; }
        .sugerencia-item:hover { background: #f0f0f0; }

        /* Etiquetas */
        .etiqueta-distrito {
            background: rgba(255,255,255,0.85)!important; border: 1.5px solid #d35400!important;
            border-radius: 4px!important; padding: 2px 5px!important; font-size: 10px!important;
            font-weight: bold!important; color: #d35400!important; pointer-events: none;
        }
        .etiqueta-loteo-nro {
            background: rgba(0,0,0,0.8); border: 1px solid white; color: #39FF14;
            font-weight: bold; font-size: 10px; padding: 1px 4px; border-radius: 3px; pointer-events: none;
        }

        /* Popups */
        .popup-custom { font-size: 12px; line-height: 1.4; min-width: 260px; max-height: 450px; overflow-y: auto; }
        .popup-header { 
            text-align: center; font-weight: bold; border-bottom: 1px solid #ddd; 
            padding-bottom: 8px; margin-bottom: 8px; color: #2c3e50; text-transform: uppercase;
        }
        .table-info { width: 100%; border-collapse: collapse; }
        .table-info td { border-bottom: 1px solid #f0f0f0; padding: 5px 0; font-size: 11px; vertical-align: top; }
        .table-info tr td:first-child { font-weight: bold; color: #666; width: 45%; text-transform: uppercase; }

        .btn-streetview {
            display: block; margin: 10px auto 5px; padding: 8px; border-radius: 6px;
            background: #4285F4; color: white !important; text-align: center;
            text-decoration: none; font-weight: bold; font-size: 12px; width: 60px;
        }
        
        .adv-sv { font-size: 10px; color: #888; text-align: center; font-style: italic; margin-top: 5px; line-height: 1.2; }
        .adv-distrito { position: absolute; bottom: 20px; right: 10px; z-index: 1000; background: rgba(255,255,255,0.7); padding: 4px 8px; border-radius: 4px; font-size: 10px; color: #555; pointer-events: none; }

        .layer-legend-icon { display: inline-block; width: 12px; height: 12px; margin-right: 8px; border: 1px solid #fff; vertical-align: middle; border-radius: 2px; }
    </style>
</head>

<body>

<div class="panel-superior">
    <input type="text" id="input-pm" placeholder="Partida Municipal" style="width:130px;">
    <button class="btn-buscar" onclick="buscarPM()">Buscar PM</button>
    
    <div style="height: 24px; width: 1px; background: #ddd; margin: 0 5px;"></div>

    <div style="position:relative; display: flex; gap: 5px;">
        <input type="text" id="input-calle" placeholder="Nombre de Calle..." style="width:160px;" autocomplete="off">
        <input type="number" id="input-altura" placeholder="Altura" style="width:60px;">
        <button class="btn-buscar" onclick="buscarDireccion()">Ir</button>
        <div id="sugerencias-calles"></div>
    </div>
</div>

<div class="adv-distrito">Límites indicativos de distritos municipales.</div>
<div id="map"></div>

<script>
const BASE_URL = "https://raw.githubusercontent.com/dcartografiayde/IDE-PARANA/main/";
var map = L.map('map', { center: [-31.745, -60.51], zoom: 13 });

var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
var ref = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}');
var hibrido = L.layerGroup([sat, ref]).addTo(map);

var grupoDistritos = L.layerGroup().addTo(map);
fetch(BASE_URL + "distritos.geojson").then(r => r.json()).then(data => {
    L.geoJSON(data, {
        style: f => ({ fillColor: '#e67e22', weight: 2.5, color: 'white', fillOpacity: 0.35 }),
        onEachFeature: (f, l) => {
            if (f.properties.distrito) {
                l.bindTooltip(f.properties.distrito, { permanent: true, className: 'etiqueta-distrito', opacity: 0.8 });
            }
        }
    }).addTo(grupoDistritos);
});

fetch(BASE_URL + "catastro/manzana.geojson").then(r => r.json()).then(data => {
    L.geoJSON(data, { style: { color: "#555", weight: 0.3, fillOpacity: 0.02, interactive: false } }).addTo(map);
});

var grupoCalles = L.layerGroup().addTo(map);
var listaCallesParaBusqueda = [];

fetch(BASE_URL + "calles.geojson").then(r => r.json()).then(data => {
    L.geoJSON(data, {
        style: { color: "#333", weight: 8, opacity: 0.01 },
        onEachFeature: (f, l) => {
            if (f.properties.nombre) {
                listaCallesParaBusqueda.push({ nombre: f.properties.nombre, layer: l });
                l.on('click', (e) => {
                    let sv = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${e.latlng.lat},${e.latlng.lng}`;
                    l.bindPopup(`<b>Calle:</b> ${f.properties.nombre}<br><a href="${sv}" target="_blank" class="btn-streetview">📍 SV</a>`).openPopup();
                });
            }
        }
    }).addTo(grupoCalles);
    configurarBuscadorCalles();
    activarEtiquetasCalles();
});

function activarEtiquetasCalles() {
    map.on('zoomend moveend', function() {
        let z = map.getZoom();
        grupoCalles.eachLayer(ly => { if(ly._text) ly.setText(null); });
        if (z >= 16) {
            grupoCalles.eachLayer(ly => {
                if (ly.feature && ly.feature.properties.nombre && map.getBounds().intersects(ly.getBounds())) {
                    ly.setText(ly.feature.properties.nombre.toUpperCase(), {
                        repeat: false, center: true, offset: 0, orientation: 'flip',
                        attributes: { 
                            fill: '#FFFF00', 'font-weight': 'bold', 'font-size': z >= 18 ? '14' : '11',
                            'stroke': 'black', 'stroke-width': '2.5px', 'paint-order': 'stroke'
                        }
                    });
                }
            });
        }
    });
}

var parcelasLayers = [];
var grupoParcelas = L.layerGroup().addTo(map);
const archivosCatastro = ["parcela1_4.geojson", "parcela5_7.geojson", "parcela8_15.geojson"];

archivosCatastro.forEach(file => {
    fetch(BASE_URL + "catastro/" + file).then(r => r.json()).then(data => {
        let grupos = {};
        data.features.forEach(f => {
            let key = JSON.stringify(f.geometry.coordinates);
            if (!grupos[key]) grupos[key] = [];
            grupos[key].push(f);
        });

        let featuresProcesadas = Object.values(grupos).map(g => {
            let base = g[0];
            return {
                type: "Feature", geometry: base.geometry,
                properties: {
                    esPH: g.length > 1,
                    partidas: g.map(x => x.properties.nropasd),
                    ubicacion: base.properties.ubipar1 || "-",
                    estado_original: base.properties.estado || "-",
                    full: base.properties
                }
            };
        });

        let ly = L.geoJSON(featuresProcesadas, {
            style: f => ({ color: f.properties.esPH ? "#8e44ad" : "#2980b9", weight: 0.8, fillOpacity: 0.15 }),
            onEachFeature: (f, l) => {
                l.on('click', e => {
                    let p = f.properties;
                    let sv = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${e.latlng.lat},${e.latlng.lng}`;
                    let content = `<div class="popup-custom"><div class="popup-header">DATOS DE LA PARCELA</div>`;

                    if (p.esPH) {
                        /* Formato Unidades PH (image_2e0b57.png) */
                        content += `<div style="padding:5px;">`;
                        content += `<b>TIPO:</b> UNIDAD PH<br>`;
                        content += `<b>PARTIDAS:</b><br>${p.partidas.join("<br>")}<br><br>`;
                        content += `<b>UBICACIÓN:</b> ${p.ubicacion}<br>`;
                        content += `<b>ESTADO:</b> ${p.estado_original}`;
                        content += `</div>`;
                    } else {
                        /* Formato Parcela Común (image_2e69ab.jpg) */
                        content += `<table class="table-info">`;
                        for (let [k, v] of Object.entries(p.full)) {
                            if (k.toLowerCase() !== 'ncp') {
                                content += `<tr><td>${k.toUpperCase()}</td><td>${v || "-"}</td></tr>`;
                            }
                        }
                        content += `</table>`;
                    }
                    content += `<a href="${sv}" target="_blank" class="btn-streetview">📍 SV</a>`;
                    content += `<div class="adv-sv">Para una mejor orientación de la vista, haga clic en la calzada.</div></div>`;
                    l.bindPopup(content).openPopup();
                });
            }
        });
        parcelasLayers.push(ly);
        grupoParcelas.addLayer(ly);
    });
});

var grupoCocheras = L.layerGroup();
var grupoCorredores = L.layerGroup();

fetch(BASE_URL + "cocheras_porcentaje_zona.geojson").then(r => r.json()).then(data => {
    function getZC(p){ return p >= 20 ? "#4a148c" : p >= 15 ? "#7b1fa2" : "#ce93d8"; }
    L.geoJSON(data, {
        style: f => ({ color: "#000", weight: 2, fillColor: getZC(parseFloat(f.properties.porcentaje)||0), fillOpacity: 0.5 }),
        onEachFeature: (f, l) => { l.bindPopup("<b>Zonificación Cocheras</b><br>" + f.properties.porcentaje + "%"); }
    }).addTo(grupoCocheras);
});

fetch(BASE_URL + "corredores_cocheras.geojson").then(r => r.json()).then(data => {
    L.geoJSON(data, { style: { color: "#e91e63", weight: 4, dashArray: "5, 5" } }).addTo(grupoCorredores);
});

var grupoLoteosHabilitados = L.layerGroup();
var grupoLoteosAprobados = L.layerGroup();
var grupoLoteosSinOrd = L.layerGroup();
var grupoLoteosPrivadosInfo = L.layerGroup();

const setupLoteo = (file, grupo, color, titulo) => {
    fetch(BASE_URL + file).then(r => r.json()).then(data => {
        L.geoJSON(data, {
            style: { color: color, weight: 2, fillColor: color, fillOpacity: 0.3 },
            onEachFeature: (f, l) => {
                let nro = f.properties.nro || f.properties.nro_ref || "";
                if(nro) l.bindTooltip(String(nro), { permanent: true, className: 'etiqueta-loteo-nro', direction: 'center' });
                l.on('click', () => {
                    let c = `<div class="popup-custom"><div class="popup-header">LOTEO ${titulo}</div><table class="table-info">`;
                    for (let [k,v] of Object.entries(f.properties)) c += `<tr><td>${k}</td><td>${v || "-"}</td></tr>`;
                    c += `</table></div>`;
                    l.bindPopup(c).openPopup();
                });
            }
        }).addTo(grupo);
    });
};

setupLoteo("backdoor/loteos_privados_habilitados.geojson", grupoLoteosHabilitados, "#39FF14", "HABILITADO");
setupLoteo("backdoor/loteos_privados_aprobados.geojson", grupoLoteosAprobados, "#FFFF33", "APROBADO");
setupLoteo("backdoor/loteos_sin_ordenanza.geojson", grupoLoteosSinOrd, "#FF00FF", "SIN ORDENANZA");
setupLoteo("backdoor/loteos_privados.geojson", grupoLoteosPrivadosInfo, "#00FFFF", "INFO ADICIONAL");

function configurarBuscadorCalles() {
    const input = document.getElementById('input-calle');
    const sug = document.getElementById('sugerencias-calles');
    input.addEventListener('input', () => {
        let val = input.value.toLowerCase();
        sug.innerHTML = '';
        if (val.length < 2) { sug.style.display = 'none'; return; }
        let uniqueNames = [...new Set(listaCallesParaBusqueda.map(c => c.nombre))];
        let matches = uniqueNames.filter(n => n.toLowerCase().includes(val)).slice(0, 8);
        if (matches.length > 0) {
            sug.style.display = 'block';
            matches.forEach(m => {
                let d = document.createElement('div');
                d.className = 'sugerencia-item'; d.innerText = m;
                d.onclick = () => { input.value = m; sug.style.display = 'none'; };
                sug.appendChild(d);
            });
        } else { sug.style.display = 'none'; }
    });
}

function buscarDireccion() {
    let nom = document.getElementById('input-calle').value.toUpperCase();
    let match = listaCallesParaBusqueda.find(c => c.nombre.toUpperCase() === nom);
    if (match) {
        map.fitBounds(match.layer.getBounds());
        if (document.getElementById('input-altura').value) map.setZoom(18);
    }
}

function buscarPM() {
    let val = document.getElementById('input-pm').value.trim();
    if (!val) return;
    parcelasLayers.forEach(ly => {
        ly.eachLayer(l => {
            if (l.feature.properties.partidas.includes(val) || String(l.feature.properties.full.nropas) === val) {
                map.fitBounds(l.getBounds(), { maxZoom: 18 });
                l.fire('click');
            }
        });
    });
}

const overlays = {
    "<span class='layer-legend-icon' style='background:#e67e22'></span> Distritos": grupoDistritos,
    "<span class='layer-legend-icon' style='background:#FFFF00; height:3px; border:none'></span> Nombres de Calles": grupoCalles,
    "<span class='layer-legend-icon' style='background:#2980b9'></span> Parcelas Catastrales": grupoParcelas,
    "<span class='layer-legend-icon' style='background:#7b1fa2'></span> Zonificación Cocheras": grupoCocheras,
    "<span class='layer-legend-icon' style='background:#e91e63; height:3px; border:none'></span> Corredores Cocheras": grupoCorredores,
    "<span class='layer-legend-icon' style='background:#39FF14'></span> Loteos Habilitados": grupoLoteosHabilitados,
    "<span class='layer-legend-icon' style='background:#FFFF33'></span> Loteos Aprobados": grupoLoteosAprobados,
    "<span class='layer-legend-icon' style='background:#FF00FF'></span> Loteos Sin Ordenanza": grupoLoteosSinOrd,
    "<span class='layer-legend-icon' style='background:#00FFFF'></span> Loteos Privados (Cyan)": grupoLoteosPrivadosInfo
};

L.control.layers({ "Híbrido": hibrido, "OpenStreetMap": osm }, overlays).addTo(map);

</script>
</body>
</html>
