<script>
const BASE_URL = "https://raw.githubusercontent.com/dcartografiayde/IDE-PARANA/main/";
const PRESERV_URL = BASE_URL + "preservacion/";

/* ================= FUNCIONES DE LIMPIEZA Y DECODIFICACIÓN DE TEXTO ================= */
function decodificarTexto(str) {
    if (!str || typeof str !== 'string') return str;
    try {
        // 1. Correcciones de mojibake UTF-8 directo
        const correcciones = {
            'Ã¡': 'á', 'Ã©': 'é', 'Ã­': 'í', 'Ã³': 'ó', 'Ãº': 'ú',
            'Ã ': 'Á', 'Ã‰': 'É', 'Ã ': 'Í', 'Ã“': 'Ó', 'Ãš': 'Ú',
            'Ã±': 'ñ', 'Ã‘': 'Ñ', 'Â°': '°', 'Ã¼': 'ü', 'Â¿': '¿'
        };
        let textoCorregido = str;
        for (let mal in correcciones) {
            textoCorregido = textoCorregido.split(mal).join(correcciones[mal]);
        }

        // 2. Mapeador inteligente para secuencias de caracteres corruptas (ï¿½ o Ï¿½) en el dataset
        const reemplazosClave = [
            { mal: /TORRE[ïÏ]¿½N/gi, bien: 'TORREÓN' },
            { mal: /Torre[ïÏ]¿½n/gi, bien: 'Torreón' },
            { mal: /APROBACI[ïÏ]¿½N/gi, bien: 'APROBACIÓN' },
            { mal: /Aprobaci[ïÏ]¿½n/gi, bien: 'Aprobación' },
            { mal: /ASOCIACI[ïÏ]¿½N/gi, bien: 'ASOCIACIÓN' },
            { mal: /Asociaci[ïÏ]¿½n/gi, bien: 'Asociación' },
            { mal: /CONSTITUCI[ïÏ]¿½N/gi, bien: 'CONSTITUCIÓN' },
            { mal: /Constituci[ïÏ]¿½n/gi, bien: 'Constitución' },
            { mal: /DECLARACI[ïÏ]¿½N/gi, bien: 'DECLARACIÓN' },
            { mal: /Declaraci[ïÏ]¿½n/gi, bien: 'Declaración' },
            { mal: /URBANIZACI[ïÏ]¿½N/gi, bien: 'URBANIZACIÓN' },
            { mal: /Urbanizaci[ïÏ]¿½n/gi, bien: 'Urbanización' },
            { mal: /PROLONGACI[ïÏ]¿½N/gi, bien: 'PROLONGACIÓN' },
            { mal: /Prolongaci[ïÏ]¿½n/gi, bien: 'Prolongación' },
            { mal: /SECCI[ïÏ]¿½N/gi, bien: 'SECCIÓN' },
            { mal: /Secci[ïÏ]¿½n/gi, bien: 'Sección' },
            { mal: /ESTACI[ïÏ]¿½N/gi, bien: 'ESTACIÓN' },
            { mal: /Estaci[ïÏ]¿½n/gi, bien: 'Estación' },
            { mal: /REVOLUCI[ïÏ]¿½N/gi, bien: 'REVOLUCIÓN' },
            { mal: /Revoluci[ïÏ]¿½n/gi, bien: 'Revolución' },
            { mal: /N[ïÏ]¿½/g, bien: 'Nº' },
            { mal: /n[ïÏ]¿½/g, bien: 'nº' },
            { mal: /PARAN[ïÏ]¿½/gi, bien: 'PARANÁ' },
            { mal: /Paran[ïÏ]¿½/gi, bien: 'Paraná' },
            { mal: /CI[ïÏ]¿½N/g, bien: 'CIÓN' },
            { mal: /ci[ïÏ]¿½n/g, bien: 'ción' }
        ];

        for (let r of reemplazosClave) {
            textoCorregido = textoCorregido.replace(r.mal, r.bien);
        }

        return textoCorregido;
    } catch (e) { return str; }
}

// Carga inteligente de archivos GeoJSON detectando problemas de codificación (UTF-8 vs Windows-1252)
async function fetchGeoJSON(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    const arrayBuffer = await response.arrayBuffer();
    
    // Intentar decodificar como UTF-8
    const decoderUTF8 = new TextDecoder('utf-8');
    let text = decoderUTF8.decode(arrayBuffer);
    
    // Si contiene caracteres de reemplazo, volvemos a decodificar usando Windows-1252 (ANSI)
    if (text.includes('\uFFFD')) {
        const decoderANSI = new TextDecoder('windows-1252');
        text = decoderANSI.decode(arrayBuffer);
    }
    return JSON.parse(text);
}

var map = L.map('map', { 
    center: [-31.745, -60.51], 
    zoom: 13, // Iniciamos en un nivel de zoom más general para la vista total de la ciudad
    zoomControl: true,
    maxZoom: 22
});

// CREACIÓN DE PANEL PERSONALIZADO PARA QUE LAS PARCELAS SE RENDERIZEN ABAJO DE OTRAS CAPAS VECTORIALES
map.createPane('parcelasPane');
map.getPane('parcelasPane').style.zIndex = 350; // Inferior a overlayPane (400)
map.getPane('parcelasPane').style.pointerEvents = 'auto'; // Permitir clics seguros

var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22, maxNativeZoom: 19 });
var dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 22, maxNativeZoom: 20 });
var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 22, maxNativeZoom: 18 });
var ref = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 22, maxNativeZoom: 18 });
var hibrido = L.layerGroup([sat, ref]);

// Arrancamos el visor exclusivamente con el mapa oscuro activo
dark.addTo(map);

function getColorDistrito(d) {
    const colors = {
        'R1': '#e74c3c', 'R2': '#3498db', 'R3': '#2ecc71', 'R4': '#f1c40f', 'R5': '#9b59b6',
        'R6': '#1abc9c', 'C1': '#e67e22', 'C2': '#d35400', 'C3': '#c0392b', 'I': '#34495e',
        'UR': '#7f8c8d', 'PR': '#27ae60'
    };
    return colors[d] || '#' + Math.floor(Math.random()*16777215).toString(16);
}

// Distrito arranca encendido por defecto
var grupoDistritos = L.layerGroup().addTo(map);
var geojsonDistritos;

fetchGeoJSON(BASE_URL + "distritos.geojson").then(data => {
    geojsonDistritos = L.geoJSON(data, {
        style: f => ({ 
            fillColor: getColorDistrito(f.properties.distrito), 
            weight: 4, 
            color: 'white', 
            fillOpacity: 0.4, 
            dashArray: '8, 8' 
        }),
        onEachFeature: (f, l) => {
            if (f.properties.distrito) {
                l.bindTooltip(decodificarTexto(f.properties.distrito), { 
                    permanent: true, 
                    className: 'etiqueta-distrito', 
                    direction: 'center',
                    opacity: 0.9 
                });
            }
        }
    }).addTo(grupoDistritos);
});

// Calles arranca encendido por defecto
var grupoCalles = L.layerGroup().addTo(map);
var listaCallesParaBusqueda = [];

fetchGeoJSON(BASE_URL + "calles.geojson").then(data => {
    L.geoJSON(data, {
        style: { color: "#FFFF00", weight: 6, opacity: 0.01 },
        onEachFeature: (f, l) => {
            if (f.properties.nombre) {
                let nombreCalle = decodificarTexto(f.properties.nombre);
                listaCallesParaBusqueda.push({ nombre: nombreCalle.toUpperCase(), layer: l });
                l.on('click', (e) => {
                    let latlng = e.latlng || l.getBounds().getCenter();
                    let sv = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${latlng.lat},${latlng.lng}`;
                    l.bindPopup(`<b>Calle:</b> ${nombreCalle.toUpperCase()}<br><a href="${sv}" target="_blank" class="btn-streetview">📍 STREET VIEW</a>`).openPopup();
                });
            }
        }
    }).addTo(grupoCalles);
    configurarBuscadorCalles();
    activarEtiquetasCalles();
});

function activarEtiquetasCalles() {
    const renderLabels = () => {
        let z = map.getZoom();
        const activeOnMap = map.hasLayer(grupoCalles);

        grupoCalles.eachLayer(geoJsonGroup => {
            geoJsonGroup.eachLayer(ly => {
                if (ly.setText) {
                    try {
                        ly.setText(null);
                    } catch (e) {}

                    if (activeOnMap && z >= 16 && ly._map && ly._renderer && ly.feature && ly.feature.properties.nombre) {
                        try {
                            if (map.getBounds().intersects(ly.getBounds())) {
                                ly.setText(decodificarTexto(ly.feature.properties.nombre).toUpperCase(), {
                                    repeat: false,
                                    center: true, 
                                    orientation: 'flip',
                                    offset: 0,
                                    attributes: { 
                                        fill: '#FFFF00', 
                                        'font-weight': 'bold', 
                                        'font-size': z >= 18 ? '13' : '10',
                                        'stroke': 'black', 
                                        'stroke-width': '2px', 
                                        'paint-order': 'stroke'
                                    }
                                });
                            }
                        } catch (err) {}
                    }
                }
            });
        });
    };

    map.on('zoomend moveend', renderLabels);
    map.on('layeradd layerremove', (e) => {
        if (e.layer === grupoCalles) {
            renderLabels();
        }
    });

    renderLabels();
}

// Las parcelas no se agregan al mapa de inicio (se manejan dinámicamente con el zoom >= 14)
var grupoParcelas = L.layerGroup();
var parcelasLayers = [];

function pointInPoly(point, vs) {
    var x = point[0], y = point[1];
    var inside = false;
    for (var i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        var xi = vs[i][0], yi = vs[i][1];
        var xj = vs[j][0], yj = vs[j][1];
        var intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
    }
    return inside;
}

// Consulta de forma inteligente si existe alguna parcela cargada en memoria bajo las coordenadas especificadas
function obtenerInfoParcelaEnPunto(latlng) {
    let resultado = null;
    if (!latlng) return resultado;
    const pt = [latlng.lng, latlng.lat];
    
    parcelasLayers.forEach(ly => {
        ly.eachLayer(l => {
            if (resultado) return; 
            const geom = l.feature.geometry;
            let isInside = false;
            if (geom.type === "Polygon") {
                if (geom.coordinates && geom.coordinates[0]) {
                    if (pointInPoly(pt, geom.coordinates[0])) isInside = true;
                }
            } else if (geom.type === "MultiPolygon") {
                if (geom.coordinates) {
                    geom.coordinates.forEach(poly => {
                        if (poly && poly[0]) {
                            if (pointInPoly(pt, poly[0])) isInside = true;
                        }
                    });
                }
            }
            if (isInside) {
                resultado = { feature: l.feature, layer: l };
            }
        });
    });
    return resultado;
}

// Función global para cerrar el popup actual de la capa superior y simular clic en la parcela catastral subyacente
window.mostrarInfoParcelaDesdePopup = function(lat, lng) {
    const latlng = L.latLng(lat, lng);
    const resultado = obtenerInfoParcelaEnPunto(latlng);
    if (resultado) {
        map.closePopup();
        setTimeout(() => {
            resultado.layer.fire('click', { latlng: latlng });
        }, 100);
    }
};

const archivosCatastro = ["parcela1_4.geojson", "parcela5_7.geojson", "parcela8_15.geojson"];
archivosCatastro.forEach(file => {
    fetchGeoJSON(BASE_URL + "catastro/" + file).then(data => {
        let grupos = {};
        data.features.forEach(f => {
            let key = JSON.stringify(f.geometry.coordinates);
            if (!grupos[key]) grupos[key] = [];
            grupos[key].push(f);
        });

        let featuresProcesadas = Object.values(grupos).map(g => {
            let base = g[0];
            return {
                type: "Feature", geometry: base.geometry,
                properties: {
                    esPH: g.length > 1,
                    partidas: g.map(x => String(x.properties.nropasd || x.properties.nropas || "").trim()),
                    ubicacion: base.properties.ubipar1 || "-",
                    full: base.properties
                }
            };
        });

        // Configurado para renderizarse en el panel 'parcelasPane' por debajo del resto de capas geográficas
        let ly = L.geoJSON(featuresProcesadas, {
            pane: 'parcelasPane',
            style: f => ({ color: f.properties.esPH ? "#8e44ad" : "#2980b9", weight: 0.7, fillOpacity: 0.12 }),
            onEachFeature: (f, l) => {
                l.on('click', e => {
                    let latlng = e.latlng || l.getBounds().getCenter();
                    let p = f.properties;
                    let sv = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${latlng.lat},${latlng.lng}`;
                    
                    let dist = "No identificado";
                    if (geojsonDistritos) {
                        const pt = [latlng.lng, latlng.lat];
                        geojsonDistritos.eachLayer(dl => {
                            const geom = dl.feature.geometry;
                            let isInside = false;
                            if (geom.type === "Polygon") { if (pointInPoly(pt, geom.coordinates[0])) isInside = true; }
                            else if (geom.type === "MultiPolygon") { geom.coordinates.forEach(poly => { if (pointInPoly(pt, poly[0])) isInside = true; }); }
                            if (isInside) dist = dl.feature.properties.distrito;
                        });
                    }

                    let content = `<div class="popup-custom"><div class="popup-header">DATOS DE LA PARCELA</div>`;
                    content += `<div style="margin-bottom:2px; font-weight:bold; color:#2d3748; font-size:9px;">DISTRITO: <span style="color:#2980b9">${decodificarTexto(dist)}</span></div>`;
                    if (p.esPH) {
                        content += `<div style="padding:2px; font-size:9px;"><b>PH DETECTADA</b><br><b>PARTIDAS:</b> ${p.partidas.join(", ")}<br><b>UBICACIÓN:</b> ${decodificarTexto(p.ubicacion)}</div>`;
                    } else {
                        content += `<table class="table-info">`;
                        for (let [k, v] of Object.entries(p.full)) { 
                            if (v && v !== "0") content += `<tr><td>${decodificarTexto(k).toUpperCase()}</td><td>${decodificarTexto(String(v))}</td></tr>`; 
                        }
                        content += `</table>`;
                    }
                    content += `<a href="${sv}" target="_blank" class="btn-streetview">📍 STREET VIEW</a>`;
                    content += `<div class="adv-sv">Para mejor orientación, haga clic en el frente de la parcela.</div>`;
                    content += `<div class="adv-legal">Nota Ord. 8563: Para parcelas en calles límite, se pueden considerar usos del distrito colindante (Sección V).</div>`;
                    content += `</div>`;
                    
                    l.bindPopup(content, { autoPanPadding: L.point(10, 110) }).openPopup(latlng);
                });
            }
        });
        parcelasLayers.push(ly);
        grupoParcelas.addLayer(ly);
    });
});

// Controlar de forma dinámica la visibilidad de parcelas basándose en el zoom
function controlarVisibilidadParcelas() {
    let zoomActual = map.getZoom();
    // Solo mostramos parcelas si el zoom es mayor o igual a 14
    if (zoomActual >= 14) {
        if (!map.hasLayer(grupoParcelas)) {
            map.addLayer(grupoParcelas);
        }
    } else {

const setupLoteo = (file, grupo, color, titulo) => {
    fetchGeoJSON(BASE_URL + "backdoor/" + file).then(data => {
        L.geoJSON(data, {
            style: { color: color, weight: 2, fillColor: color, fillOpacity: 0.3 },
            onEachFeature: (f, l) => {
                let nro = f.properties.nro || f.properties.nro_ref || "";
                if(nro) l.bindTooltip(String(nro), { permanent: true, className: 'etiqueta-loteo-nro', direction: 'center' });
                
                // POPUP SIN STREET VIEW EXCLUSIVO PARA CAPAS DE LOTEOS
                l.on('click', (e) => {
                    let latlng = e.latlng || l.getBounds().getCenter();
                    let c = `<div class="popup-custom"><div class="popup-header">LOTEO ${titulo}</div><table class="table-info">`;
                    for (let [k,v] of Object.entries(f.properties)) { 
                        if(v) c += `<tr><td>${decodificarTexto(k).toUpperCase()}</td><td>${decodificarTexto(String(v))}</td></tr>`; 
                    }
                    c += `</table>`;
                    
                    // Comprobación espacial: Si existe parcela catastral debajo, ofrece acceso directo alternativo
                    let parcelaEncontrada = obtenerInfoParcelaEnPunto(latlng);
                    if (parcelaEncontrada) {
                        c += `<hr style="margin: 6px 0; border-style: dashed; border-color: #cbd5e1;">`;
                        c += `<div class="text-[8px] text-slate-500 italic text-center mb-1">Hay una parcela catastral debajo.</div>`;
                        c += `<button onclick="mostrarInfoParcelaDesdePopup(${latlng.lat}, ${latlng.lng})" class="w-full text-center py-1 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold text-[9px] uppercase transition-colors">👉 Ver Parcela Catastral debajo</button>`;
                    } else {
                        c += `<div class="text-[8px] text-slate-400 italic text-center mt-1">Para ver la parcela debajo, desactive la capa de Loteos desde el menú de la derecha.</div>`;
                    }
                    c += `</div>`;
                    l.bindPopup(c, { autoPanPadding: L.point(10, 110) }).openPopup(latlng);
                });

                // INDEXACIÓN PARA LA BÚSQUEDA PREDICTIVA Decodificada para evitar fallos de búsqueda con caracteres especiales
                let props = f.properties;
                let nombre = "";
                let propietario = "";
                let ordenanza = "";
                let expediente = "";
                for (let [k, v] of Object.entries(props)) {
                    let keyLower = k.toLowerCase();
                    if (keyLower.includes("nombre") || keyLower.includes("denominac")) nombre = decodificarTexto(String(v));
                    if (keyLower.includes("propietario") || keyLower.includes("firma") || keyLower.includes("solicitan") || keyLower.includes("titular")) propietario = decodificarTexto(String(v));
                    if (keyLower.includes("ordenanza") || keyLower === "ord" || keyLower.includes("nro_ord")) ordenanza = decodificarTexto(String(v));
                    
                    // Indexamos cualquier expediente de aprobación, factibilidad o trámite administrativo
                    if (keyLower.includes("exp") || keyLower.includes("expediente") || keyLower.includes("expte")) {
                        let expVal = decodificarTexto(String(v)).trim();
                        if (expVal && expVal !== "0" && expVal !== "NULL" && expVal !== "-") {
                            if (expediente) {
                                expediente += " / " + expVal;
                            } else {
                                expediente = expVal;
                            }
                        }
                    }
                }

                if (!nombre && (props.nombre || props.Nombre)) nombre = decodificarTexto(String(props.nombre || props.Nombre));

                listaLoteosParaBusqueda.push({
                    nombre: String(nombre || "").toUpperCase().trim(),
                    propietario: String(propietario || "").toUpperCase().trim(),
                    ordenanza: String(ordenanza || "").toUpperCase().trim(),
                    expediente: String(expediente || "").toUpperCase().trim(),
                    layer: l,
                    grupo: grupo,
                    tipo: titulo,
                    fullLabel: `${titulo}: ${nombre || 'S/N'}${propietario ? ' - Prop: ' + propietario : ''}${ordenanza ? ' (Ord: ' + ordenanza + ')' : ''}${expediente ? ' (Expte: ' + expediente + ')' : ''}`
                });
            }
        }).addTo(grupo);
    });
};

function getStreetViewLink(lat, lng) {
    return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;
}

function getSVHTML(lat, lng) {
    return `
        <div class="aviso-sv">
            <i>ⓘ</i> <span>Para ver la fachada, haga clic cerca del frente de la parcela.</span>
        </div>
        <a href="${getStreetViewLink(lat, lng)}" target="_blank" class="btn-streetview" title="Abrir Street View">📍 VER STREET VIEW</a>
    `;
}

function loadPreserv(file, grupo, color, titulo, op = 0.5) {
    fetchGeoJSON(PRESERV_URL + file).then(data => {
        L.geoJSON(data, {
            style: { color: color, weight: 2, fillColor: color, fillOpacity: op },
            onEachFeature: (f, l) => {
                l.on('click', e => {
                    let latlng = e.latlng || l.getBounds().getCenter();
                    let p = f.properties;
                    let html = `<div class="popup-info"><div class="popup-header" style="color:${color};">${titulo.toUpperCase()}</div><hr style="margin-bottom:6px;">`;
                    const camposExcluidos = ['link', 'fid', 'ncp', 'descripdis', 'ogc_fid'];
                    
                    for (let k in p) {
                        let valor = p[k];
                        if (!valor || valor === "NULL" || camposExcluidos.includes(k.toLowerCase())) continue;
                        
                        let labelText = k;
                        if (k.toLowerCase() === 'ubipar1') labelText = "Ubicación";
                        else if (k.toLowerCase() === 'nropasd') labelText = "Partida Municipal";
                        else if (k.toLowerCase() === 'denominaci') labelText = "Nombre";

                        let valorLimpio = decodificarTexto(String(valor));
                        html += `<b>${decodificarTexto(labelText).toUpperCase()}:</b> ${valorLimpio}<br>`;
                    }
                    
                    html += getSVHTML(latlng.lat, latlng.lng);
                    
                    // Comprobación espacial: Si existe parcela catastral debajo, ofrece acceso directo alternativo
                    let parcelaEncontrada = obtenerInfoParcelaEnPunto(latlng);
                    if (parcelaEncontrada) {
                        html += `<hr style="margin: 8px 0; border-color: #e2e8f0;">`;
                        html += `<div class="text-[8px] text-slate-500 italic text-center mb-1">Hay una parcela catastral debajo.</div>`;
                        html += `<button onclick="mostrarInfoParcelaDesdePopup(${latlng.lat}, ${latlng.lng})" class="w-full text-center py-1 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold text-[9px] uppercase transition-colors">👉 Ver Parcela Catastral debajo</button>`;
                    } else {
                        html += `<div class="text-[8px] text-slate-400 italic text-center mt-1">Para ver la parcela debajo, desactive esta capa de preservación en el panel de control de la derecha.</div>`;
                    }
                    html += `</div>`;
                    
                    l.bindPopup(html, { autoPanPadding: L.point(10, 110) }).openPopup(latlng);
                });
            }
        }).addTo(grupo);
    });
}

function buscarPM() {
    let val = document.getElementById('input-pm').value.trim();
    if (!val) return;
    let encontrado = false;
    parcelasLayers.forEach(ly => {
        ly.eachLayer(l => {
            if (l.feature.properties.partidas.includes(val)) {
                // Al buscar, forzamos el zoom a 19, lo que activará automáticamente la visibilidad de las parcelas
                map.fitBounds(l.getBounds(), { maxZoom: 19 });

                encontrado = true;
            }

}

function buscarDireccion() {
    let nom = document.getElementById('input-calle').value.toUpperCase();
    let match = listaCallesParaBusqueda.find(c => c.nombre === nom);
    if (match) {
        map.fitBounds(match.layer.getBounds(), { maxZoom: 16 });

    }

function configurarBuscadorCalles() {
    const input = document.getElementById('input-calle');
    const sug = document.getElementById('sugerencias-calles');
    input.addEventListener('input', () => {
        let val = input.value.toUpperCase();
        sug.innerHTML = '';
        if (val.length < 2) { sug.style.display = 'none'; return; }
        let matches = [...new Set(listaCallesParaBusqueda.map(c => c.nombre))]
            .filter(n => n.includes(val)).slice(0, 6);
        if (matches.length > 0) {
            sug.style.display = 'block';
            matches.forEach(m => {
                let d = document.createElement('div');
                d.className = 'sugerencia-item'; d.innerText = m;
                d.onclick = () => { input.value = m; sug.style.display = 'none'; };
                sug.appendChild(d);
            });
        } else { sug.style.display = 'none'; }
    });
}

function configurarBuscadorLoteos() {
    const input = document.getElementById('input-loteo');
    const sug = document.getElementById('sugerencias-loteos');
    
    input.addEventListener('input', () => {
        let val = input.value.toUpperCase().trim();
        sug.innerHTML = '';
        if (val.length < 2) { sug.style.display = 'none'; return; }
        
        // Búsqueda predictiva comparando campos Nombre, Propietario u Ordenanza
        let matches = listaLoteosParaBusqueda.filter(item => {
            return item.nombre.includes(val) || 
                   item.propietario.includes(val) || 
                   item.ordenanza.includes(val);
        }).slice(0, 8);
        
        if (matches.length > 0) {
            sug.style.display = 'block';
            matches.forEach(item => {
                let d = document.createElement('div');
                d.className = 'sugerencia-item';
                d.innerText = decodificarTexto(item.fullLabel);
                d.onclick = () => {
                    input.value = decodificarTexto(item.nombre || item.propietario || item.ordenanza || "");
                    sug.style.display = 'none';
                    
                    // Activar la capa de loteos correspondiente si se encuentra desactivada en la leyenda
                    if (!map.hasLayer(item.grupo)) {
                        map.addLayer(item.grupo);
                    }
                    
                    // Zoom dinámico a los límites de la entidad seleccionada
                    map.fitBounds(item.layer.getBounds(), { maxZoom: 18 });
                    item.layer.fire('click');
                };
                sug.appendChild(d);
            });
        } else {
            sug.style.display = 'none';
        }
    });

    // Cerrar sugerencias al hacer clic fuera del buscador
    document.addEventListener('click', (e) => {
        if (e.target !== input) {
            sug.style.display = 'none';
        }
    });
}
