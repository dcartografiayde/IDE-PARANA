<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Urbano Paraná - Análisis IA Estable</title>

    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Turf.js para análisis espacial -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        body { margin:0; padding:0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #0b1622; }
        #map { height: 100vh; width: 100%; background:#001a33; }

        .panel-superior {
            position:absolute; top:15px; left:60px; z-index:2000;
            background:white; padding:12px; border-radius:12px;
            box-shadow:0 8px 32px rgba(0,0,0,0.15);
            display:flex; gap:10px; align-items: center;
            max-width: calc(100% - 100px);
        }

        .input-search { width:150px; padding:10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; }

        .btn-ai-primary {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white !important; border: none; padding: 10px 16px;
            border-radius: 8px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }

        #ai-sidebar {
            position: fixed; right: -420px; top: 0; width: 400px; height: 100vh;
            background: white; z-index: 3000; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease-in-out;
            display: flex; flex-direction: column;
        }
        #ai-sidebar.active { right: 0; }
        
        .ai-header { padding: 20px; background: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center; }
        .ai-body { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .ai-footer { padding: 15px; border-top: 1px solid #eee; background: #fafafa; }

        .ai-message { 
            background: #f0f2f5; padding: 12px; border-radius: 12px; 
            margin-bottom: 15px; border-left: 4px solid #8e44ad; font-size: 14px;
            line-height: 1.5;
        }

        .ai-message.edificabilidad { border-left-color: #27ae60; background: #eafaf1; }
        .ai-message.error { border-left-color: #e74c3c; background: #fdedec; color: #a93226; font-weight: bold; }

        .popup-container { min-width: 300px; max-height: 450px; overflow-y: auto; }
        .popup-title { font-weight: bold; color: #2c3e50; font-size: 14px; display: block; border-left: 3px solid #3498db; padding-left: 8px; margin: 10px 0; }
        .popup-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
        .popup-label { color: #7f8c8d; }
        .popup-value { font-weight: bold; }

        .badge-zona { background: #e67e22; color: white; padding: 4px 10px; border-radius: 6px; font-weight: bold; display: block; text-align: center; margin-bottom: 10px; }

        .btn-action { 
            width: 100%; padding: 10px; margin-top: 6px; border: none; border-radius: 6px; 
            cursor: pointer; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-sv { background: #4285f4; color: white; }
        .btn-ai-blue { background: #8e44ad; color: white; }
        .btn-ai-green { background: #27ae60; color: white; }

        .loading-dots:after { content: ' .'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 40% { color: #8e44ad; text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .5em 0 0 #8e44ad, 1em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .5em 0 0 #8e44ad, 1em 0 0 #8e44ad; } }

        /* Buscador Sugerencias */
        .search-container { position: relative; }
        #lista-calles {
            position: absolute; top: 100%; left: 0; width: 100%;
            background: white; border: 1px solid #ddd; max-height: 200px; 
            overflow-y: auto; z-index: 1000; display: none; border-radius: 0 0 8px 8px;
        }
        #lista-calles div { padding: 8px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="panel-superior">
    <div class="search-container">
        <input type="text" id="input-calle" class="input-search" placeholder="Calle y altura..." oninput="sugerirCalles()">
        <div id="lista-calles"></div>
    </div>
    <input type="text" id="input-pm" class="input-search" placeholder="Partida Municipal...">
    <button onclick="buscarPM()" style="padding:10px 15px; cursor:pointer; background:#2c3e50; color:white; border:none; border-radius:8px; font-weight: 600;">Buscar</button>
    <button class="btn-ai-primary" onclick="toggleAISidebar(true)">✨ Asistente Urbano</button>
</div>

<div id="ai-sidebar">
    <div class="ai-header">
        <h2 style="margin:0; font-size: 16px;">Análisis con Inteligencia Artificial ✨</h2>
        <span style="cursor:pointer; font-size: 24px;" onclick="toggleAISidebar(false)">&times;</span>
    </div>
    <div class="ai-body" id="ai-chat-history">
        <div class="ai-message">Bienvenido. Selecciona una parcela en el mapa para analizar su potencial edificable según la Ord. 8563.</div>
    </div>
    <div class="ai-footer">
        <div style="display:flex; gap:5px;">
            <input type="text" id="chat-input" placeholder="Pregunta sobre normativa..." style="flex:1; padding:10px; border-radius:8px; border:1px solid #ddd;" onkeypress="if(event.key==='Enter') sendChatQuery()">
            <button onclick="sendChatQuery()" style="background:#2c3e50; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">➔</button>
        </div>
    </div>
</div>

<div id="map"></div>

<script>
const BASE_URL = "https://raw.githubusercontent.com/dcartografiayde/IDE-PARANA/main/";
// CLAVE DE API: En este entorno se inyecta automáticamente. 
// Para que funcione en tu GitHub, DEBES pegar aquí tu clave de la captura d5358d.png si esta no se autocompleta.
let apiKey = ""; 

/* ================= NÚCLEO IA GEMINI - VERSIÓN ESTABLE ================= */
async function callGemini(prompt, systemMsg) {
    // Usamos el modelo más reciente y estable disponible
    const modelName = "gemini-2.0-flash-exp"; 
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

    const requestBody = {
        contents: [
            {
                role: "user",
                parts: [{ text: `INSTRUCCIÓN DE SISTEMA: ${systemMsg}\n\nPREGUNTA DEL USUARIO: ${prompt}` }]
            }
        ],
        generationConfig: {
            temperature: 0.2,
            topK: 40,
            topP: 0.95,
            maxOutputTokens: 1024,
        }
    };

    // Lógica de reintentos
    for (let attempt = 0; attempt < 3; attempt++) {
        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (response.ok) {
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "La IA no pudo generar una respuesta coherente.";
            }

            // Manejo específico de errores según tus capturas
            if (response.status === 404) {
                console.error("Modelo no encontrado. Probando con modelo alternativo...");
                return "❌ Error 404: El modelo especificado no está activo en tu región o proyecto de Google Cloud.";
            }
            
            if (response.status === 429) {
                await new Promise(r => setTimeout(r, 2000)); // Esperar 2 segundos si hay saturación
                continue;
            }

            return `❌ Error HTTP ${response.status}: ${data.error?.message || "Error desconocido"}`;

        } catch (error) {
            if (attempt === 2) return "❌ Error de conexión: No se pudo contactar con el servidor de Google.";
        }
    }
}

async function analizarFactibilidad(parcelaData, zonaNombre) {
    toggleAISidebar(true);
    const history = document.getElementById('ai-chat-history');
    const loading = showLoading("Consultando normativa local...");

    const system = "Eres un consultor experto en Urbanismo de Paraná. Conoces la Ordenanza 8563. Responde de forma técnica pero clara.";
    const prompt = `Analiza la parcela con datos catastrales: ${JSON.stringify(parcelaData)}. Está en el Distrito ${zonaNombre}. Indica brevemente usos principales (vivienda, comercio) y si existen retiros obligatorios conocidos.`;

    const respuesta = await callGemini(prompt, system);
    removeLoading(loading);
    addAiMessage(`Normativa en ${zonaNombre}`, respuesta);
}

async function generarInformeEdificabilidad(parcelaData, zonaNombre, area) {
    toggleAISidebar(true);
    const history = document.getElementById('ai-chat-history');
    const loading = showLoading("Calculando m² potenciales...");

    const system = "Eres un analista de inversiones inmobiliarias en Argentina. Estimas FOS y FOT.";
    const prompt = `Parcela de ${area.toFixed(2)} m² en Distrito ${zonaNombre} de Paraná. Estima: 1. Metros construibles totales (FOT estimado). 2. Superficie en planta (FOS estimado). 3. Cantidad posible de pisos. Aclara que es una estimación basada en la Ord. 8563.`;

    const respuesta = await callGemini(prompt, system);
    removeLoading(loading);
    addAiMessage(`Potencial Edificable - ${zonaNombre}`, respuesta, "edificabilidad");
}

async function sendChatQuery() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    addAiMessage("Tú", text, "user");
    const loading = showLoading("Analizando...");
    const respuesta = await callGemini(text, "Asistente del Visor Urbano de Paraná. Responde dudas sobre la ciudad y su código urbano.");
    removeLoading(loading);
    addAiMessage("IA Urbana", respuesta);
}

/* Helpers UI IA */
function showLoading(txt) {
    const d = document.createElement('div');
    d.className = 'ai-message loading-dots';
    d.innerText = txt;
    document.getElementById('ai-chat-history').appendChild(d);
    return d;
}
function removeLoading(el) { el.remove(); }
function addAiMessage(title, text, type="") {
    const history = document.getElementById('ai-chat-history');
    const d = document.createElement('div');
    d.className = `ai-message ${type}`;
    d.innerHTML = `<strong>${title}:</strong><br>${text.replace(/\n/g, '<br>')}`;
    history.appendChild(d);
    history.scrollTop = history.scrollHeight;
}
function toggleAISidebar(show) { document.getElementById('ai-sidebar').classList.toggle('active', show); }

/* ================= MAPA Y LÓGICA ESPACIAL ================= */
var map = L.map('map',{ center:[-31.733, -60.52], zoom:15 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(map);

var distritosGeoJSON = null;
fetch(BASE_URL + "distritos.geojson").then(r => r.json()).then(data => {
    distritosGeoJSON = data;
    L.geoJSON(data, { style: { color: "#e67e22", weight: 1.5, fillOpacity: 0.1, dashArray: '5,5' } }).addTo(map);
});

function detectarZona(latlng) {
    if (!distritosGeoJSON) return "U.R.";
    const point = turf.point([latlng.lng, latlng.lat]);
    let zona = "U.R.";
    turf.featureEach(distritosGeoJSON, (f) => {
        if (turf.booleanPointInPolygon(point, f)) zona = f.properties.nombre || f.properties.distrito || zona;
    });
    return zona;
}

var parcelasLayers = [];
function getParcelaPopup(f, latlng) {
    const p = f.properties;
    const zona = detectarZona(latlng);
    const area = turf.area(f);
    const dataJson = JSON.stringify(p).replace(/'/g, "&apos;");

    let html = `<div class="popup-container">`;
    html += `<span class="badge-zona">${zona}</span>`;
    html += `<span class="popup-title">Datos del Inmueble</span>`;
    html += `<div class="popup-row"><span class="popup-label">Sup. Terreno:</span><span class="popup-value">${area.toFixed(2)} m²</span></div>`;
    
    for (let key in p) {
        if(p[key] && key !== 'nropar') {
            html += `<div class="popup-row"><span class="popup-label">${key}:</span><span class="popup-value">${p[key]}</span></div>`;
        }
    }

    html += `<button class="btn-action btn-sv" onclick="window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${latlng.lat},${latlng.lng}', '_blank')">📷 Ver Street View</button>`;
    html += `<button class="btn-action btn-ai-blue" onclick='analizarFactibilidad(${dataJson}, "${zona}")'>✨ Normativa IA</button>`;
    html += `<button class="btn-action btn-ai-green" onclick='generarInformeEdificabilidad(${dataJson}, "${zona}", ${area})'>📊 Edificabilidad IA</button>`;
    html += `</div>`;
    return html;
}

const capasCatastro = ["parcela1_4.geojson", "parcela5_7.geojson", "parcela8_15.geojson"];
capasCatastro.forEach(file => {
    fetch(BASE_URL + "catastro/" + file).then(r => r.json()).then(data => {
        const ly = L.geoJSON(data, {
            style: { color: "#3498db", weight: 1, fillOpacity: 0.2 },
            onEachFeature: (f, l) => {
                l.on('click', (e) => { l.bindPopup(getParcelaPopup(f, e.latlng)).openPopup(); });
            }
        });
        parcelasLayers.push(ly);
        ly.addTo(map);
    });
});

/* ================= BUSCADORES ================= */
var callesData = [];
fetch(BASE_URL + "calles.geojson").then(r => r.json()).then(data => {
    callesData = data.features.map(f => ({
        nombre: f.properties.nombre,
        desde: parseInt(f.properties.desde),
        hasta: parseInt(f.properties.hasta),
        bounds: L.geoJSON(f).getBounds()
    }));
});

function sugerirCalles() {
    const val = document.getElementById('input-calle').value.toLowerCase();
    const list = document.getElementById('lista-calles');
    list.innerHTML = '';
    if (val.length < 3) { list.style.display = 'none'; return; }

    const sugerencias = [...new Set(callesData.filter(c => c.nombre && c.nombre.toLowerCase().includes(val)).map(c => c.nombre))].slice(0, 6);
    sugerencias.forEach(s => {
        const d = document.createElement('div');
        d.innerText = s;
        d.onclick = () => {
            document.getElementById('input-calle').value = s;
            list.style.display = 'none';
            const found = callesData.find(c => c.nombre === s);
            if(found) map.fitBounds(found.bounds);
        };
        list.appendChild(d);
    });
    list.style.display = sugerencias.length ? 'block' : 'none';
}

function buscarPM() {
    const pm = document.getElementById('input-pm').value.trim();
    if (!pm) return;
    let encontrada = false;
    parcelasLayers.forEach(ly => ly.eachLayer(l => {
        if (String(l.feature.properties.nropasd) === pm || String(l.feature.properties.nropar) === pm) {
            map.fitBounds(l.getBounds(), { maxZoom: 18 });
            l.openPopup();
            encontrada = true;
        }
    }));
    if(!encontrada) addAiMessage("Buscador", "No se encontró la Partida Municipal " + pm, "error");
}
</script>
</body>
</html>
