<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Urbano Paraná - Análisis de Código Urbano Pro</title>

    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Turf.js para análisis espacial -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <!-- Plugins: TextPath para nombres de calles -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-textpath@1.2.3/leaflet.textpath.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <style>
        body { margin:0; padding:0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #0b1622; }
        #map { height: 100vh; width: 100%; background:#001a33; }

        .panel-superior {
            position:absolute; top:15px; left:60px; z-index:2000;
            background:white; padding:12px; border-radius:12px;
            box-shadow:0 8px 32px rgba(0,0,0,0.15);
            display:flex; gap:10px; align-items: center;
            max-width: calc(100% - 100px);
        }

        .input-search { width:150px; padding:10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; }

        .btn-ai-primary {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white !important; border: none; padding: 10px 16px;
            border-radius: 8px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }

        #ai-sidebar {
            position: fixed; right: -420px; top: 0; width: 400px; height: 100vh;
            background: white; z-index: 3000; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease-in-out;
            display: flex; flex-direction: column;
        }
        #ai-sidebar.active { right: 0; }
        
        .ai-header { padding: 20px; background: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center; }
        .ai-body { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .ai-footer { padding: 15px; border-top: 1px solid #eee; background: #fafafa; }

        .ai-message { 
            background: #f0f2f5; padding: 12px; border-radius: 12px; 
            margin-bottom: 15px; border-left: 4px solid #8e44ad; font-size: 14px;
        }

        .ai-message.edificabilidad { border-left-color: #27ae60; background: #eafaf1; }
        .ai-message.error { border-left-color: #e74c3c; background: #fdedec; color: #a93226; font-weight: bold; }

        .search-container { position: relative; }
        #lista-calles {
            position: absolute; top: 100%; left: 0; width: 100%;
            background: white; border: 1px solid #ddd; max-height: 200px; 
            overflow-y: auto; z-index: 1000; display: none; border-radius: 0 0 8px 8px;
        }
        #lista-calles div { padding: 8px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #eee; }

        .popup-container { min-width: 300px; max-height: 450px; overflow-y: auto; padding-right: 5px; }
        .popup-section { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .popup-title { font-weight: bold; color: #2c3e50; font-size: 14px; margin-bottom: 5px; display: block; border-left: 3px solid #3498db; padding-left: 8px; }
        .popup-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 11px; }
        .popup-label { color: #7f8c8d; flex: 1; }
        .popup-value { color: #2c3e50; font-weight: bold; text-align: right; flex: 1; }
        
        .badge-ph { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .badge-comun { background: #3498db; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .badge-zona { background: #e67e22; color: white; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 13px; display: inline-block; margin-top: 5px; }

        .btn-action { 
            width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 6px; 
            cursor: pointer; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-sv { background: #4285f4; color: white; }
        .btn-ai-blue { background: #8e44ad; color: white; }
        .btn-ai-green { background: #27ae60; color: white; }

        .loading-dots:after { content: ' .'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 40% { color: #8e44ad; text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .5em 0 0 #8e44ad, 1em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .5em 0 0 #8e44ad, 1em 0 0 #8e44ad; } }
    </style>
</head>
<body>

<div class="panel-superior">
    <div class="search-container">
        <input type="text" id="input-calle" class="input-search" placeholder="Buscar calle..." oninput="sugerirCalles()">
        <div id="lista-calles"></div>
    </div>
    <input type="text" id="input-pm" class="input-search" placeholder="Partida Municipal...">
    <button onclick="buscarPM()" style="padding:10px 15px; cursor:pointer; background:#2c3e50; color:white; border:none; border-radius:8px; font-weight: 600;">Buscar</button>
    <button class="btn-ai-primary" onclick="toggleAISidebar(true)">✨ IA Urbana</button>
</div>

<div id="ai-sidebar">
    <div class="ai-header">
        <h2 style="margin:0; font-size: 16px;">Análisis de Inversión ✨</h2>
        <span style="cursor:pointer; font-size: 24px;" onclick="toggleAISidebar(false)">&times;</span>
    </div>
    <div class="ai-body" id="ai-chat-history">
        <div class="ai-message">Selecciona una parcela para desplegar todos sus datos y realizar análisis de factibilidad con la normativa vigente (Ord. 8563).</div>
    </div>
    <div class="ai-footer">
        <div class="chat-input-container" style="display:flex; gap:5px;">
            <input type="text" id="chat-input" placeholder="Pregunta sobre la parcela..." style="flex:1; padding:10px; border-radius:8px; border:1px solid #ddd;" onkeypress="if(event.key==='Enter') sendChatQuery()">
            <button onclick="sendChatQuery()" style="background:#2c3e50; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">➔</button>
        </div>
    </div>
</div>

<div id="map"></div>

<script>
const BASE_URL = "https://raw.githubusercontent.com/dcartografiayde/IDE-PARANA/main/";
const apiKey = "AIzaSyCCwJb9GN23evSwpot1kd7r3PVrjL7H8cM"; 

/* ================= IA GEMINI CORE ================= */
async function callGemini(prompt, systemMsg) {
    if (!apiKey) return "⚠️ Falta la clave API.";

    // CORRECCIÓN CLAVE: La URL debe tener la ruta completa del modelo
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [
                    { 
                        parts: [{ text: `Actúa como un experto en urbanismo de Paraná, Entre Ríos. Basándote en la siguiente instrucción de sistema: ${systemMsg}. Ahora responde a: ${prompt}` }] 
                    }
                ],
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 800,
                }
            })
        });

        const result = await response.json();

        if (!response.ok) {
            console.error("Detalle del Error:", result);
            return `❌ Error: ${result.error?.message || "No se pudo conectar"}`;
        }

        return result.candidates?.[0]?.content?.parts?.[0]?.text || "No hay respuesta.";

    } catch (e) {
        console.error("Error conexión:", e);
        return "❌ Error de red. Revisa tu conexión.";
    }
}

async function analizarFactibilidad(parcelaData, zonaNombre) {
    toggleAISidebar(true);
    const history = document.getElementById('ai-chat-history');
    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'ai-message loading-dots';
    loadingMsg.innerText = `Consultando normativa para Distrito ${zonaNombre}`;
    history.appendChild(loadingMsg);
    history.scrollTop = history.scrollHeight;

    const systemMsg = "Eres un consultor experto en la Ordenanza 8563 de Paraná. Explica usos permitidos y retiros.";
    const prompt = `Parcela: ${JSON.stringify(parcelaData)}. Distrito: ${zonaNombre}. Resume qué se puede construir.`;
    
    const respuesta = await callGemini(prompt, systemMsg);
    history.removeChild(loadingMsg);
    
    const aiMsg = document.createElement('div');
    aiMsg.className = (respuesta.includes('❌')) ? 'ai-message error' : 'ai-message';
    aiMsg.innerHTML = `<strong>Normativa en ${zonaNombre}:</strong><br>${respuesta.replace(/\n/g, '<br>')}`;
    history.appendChild(aiMsg);
    history.scrollTop = history.scrollHeight;
}

async function generarInformeEdificabilidad(parcelaData, zonaNombre, areaParcela) {
    toggleAISidebar(true);
    const history = document.getElementById('ai-chat-history');
    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'ai-message loading-dots';
    loadingMsg.innerText = `Calculando potencial...`;
    history.appendChild(loadingMsg);
    history.scrollTop = history.scrollHeight;

    const systemMsg = "Analista inmobiliario. Calcula m² con FOS/FOT.";
    const prompt = `Superficie: ${areaParcela.toFixed(2)} m². Zona: ${zonaNombre}. Estima m² construibles y pisos.`;

    const respuesta = await callGemini(prompt, systemMsg);
    history.removeChild(loadingMsg);
    
    const aiMsg = document.createElement('div');
    aiMsg.className = (respuesta.includes('❌')) ? 'ai-message error' : 'ai-message edificabilidad';
    aiMsg.innerHTML = `<strong>📊 Potencial Edificable:</strong><br>${respuesta.replace(/\n/g, '<br>')}`;
    history.appendChild(aiMsg);
    history.scrollTop = history.scrollHeight;
}

async function sendChatQuery() {
    const input = document.getElementById('chat-input');
    const query = input.value.trim();
    if (!query) return;
    
    input.value = '';
    const history = document.getElementById('ai-chat-history');
    const userMsg = document.createElement('div');
    userMsg.className = 'ai-message'; userMsg.style.background = '#fff';
    userMsg.innerHTML = `<strong>Tú:</strong> ${query}`;
    history.appendChild(userMsg);

    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'ai-message loading-dots';
    loadingMsg.innerText = `Analizando`;
    history.appendChild(loadingMsg);

    const response = await callGemini(query, "Asistente del Visor Urbano de Paraná.");
    history.removeChild(loadingMsg);
    
    const aiMsg = document.createElement('div');
    aiMsg.className = 'ai-message';
    aiMsg.innerHTML = `<strong>IA:</strong> ${response.replace(/\n/g, '<br>')}`;
    history.appendChild(aiMsg);
    history.scrollTop = history.scrollHeight;
}

function toggleAISidebar(show) { document.getElementById('ai-sidebar').classList.toggle('active', show); }

/* ================= MAPA Y CAPAS ================= */
var map = L.map('map',{ center:[-31.733, -60.52], zoom:15 });
var modoOscuro = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(map);

/* ================= DISTRITOS ================= */
var distritosGeoJSON = null;
var grupoDistritos = L.layerGroup().addTo(map);
fetch(BASE_URL + "distritos.geojson").then(r => r.json()).then(data => {
    distritosGeoJSON = data;
    L.geoJSON(data, { style: { color: "#e67e22", weight: 2, fillOpacity: 0.1, dashArray: '5,5' } }).addTo(grupoDistritos);
});

function detectarZona(latlng) {
    if (!distritosGeoJSON) return "U.R.";
    const point = turf.point([latlng.lng, latlng.lat]);
    let zona = "S/D";
    turf.featureEach(distritosGeoJSON, (f) => {
        if (turf.booleanPointInPolygon(point, f)) { zona = f.properties.nombre || f.properties.distrito || zona; }
    });
    return zona;
}

/* ================= PARCELAS ================= */
var parcelasLayers = [];
var grupoParcelas = L.layerGroup().addTo(map);

function getParcelaPopup(f, latlng) {
    const p = f.properties;
    const zona = detectarZona(latlng);
    const area = turf.area(f);
    const dataStr = JSON.stringify(p).replace(/'/g, "&apos;");

    let html = `<div class="popup-container">`;
    html += `<div class="popup-section"><span class="popup-title">ZONIFICACIÓN</span><center><span class="badge-zona">${zona}</span></center></div>`;
    html += `<div class="popup-section"><span class="popup-title">CATASTRO</span>`;
    html += `<div class="popup-row"><span class="popup-label">Sup:</span><span class="popup-value">${area.toFixed(1)} m²</span></div>`;
    html += `<div class="popup-row"><span class="popup-label">Partida:</span><span class="popup-value">${p.nropar || p.nropasd || '-'}</span></div>`;
    html += `</div>`;
    html += `<button class="btn-action btn-sv" onclick="window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${latlng.lat},${latlng.lng}', '_blank')">📷 Street View</button>`;
    html += `<button class="btn-action btn-ai-blue" onclick='analizarFactibilidad(${dataStr}, "${zona}")'>✨ Analizar Normativa IA</button>`;
    html += `<button class="btn-action btn-ai-green" onclick='generarInformeEdificabilidad(${dataStr}, "${zona}", ${area})'>🏢 Informe Edificabilidad IA</button>`;
    html += `</div>`;
    return html;
}

const archivos = ["parcela1_4.geojson", "parcela5_7.geojson", "parcela8_15.geojson"];
archivos.forEach(n => {
    fetch(BASE_URL + "catastro/" + n).then(r => r.json()).then(data => {
        var ly = L.geoJSON(data, {
            style: { color: "#3498db", weight: 1.2, fillOpacity: 0.15 },
            onEachFeature: (f, l) => {
                l.on('click', (e) => { l.bindPopup(getParcelaPopup(f, e.latlng)).openPopup(); });
            }
        });
        parcelasLayers.push(ly);
        grupoParcelas.addLayer(ly);
    });
});

/* ================= BUSCADORES ================= */
var listaCallesGlobal = [];
fetch(BASE_URL + "calles.geojson").then(r => r.json()).then(data => {
    L.geoJSON(data, {
        onEachFeature: (f, l) => {
            if (f.properties.nombre) listaCallesGlobal.push({ nombre: f.properties.nombre, bounds: l.getBounds() });
        }
    });
});

function sugerirCalles() {
    const val = document.getElementById('input-calle').value.toLowerCase();
    const list = document.getElementById('lista-calles');
    list.innerHTML = '';
    if (val.length < 3) { list.style.display='none'; return; }
    const filtered = listaCallesGlobal.filter(c => c.nombre.toLowerCase().includes(val)).slice(0,5);
    filtered.forEach(c => {
        const d = document.createElement('div');
        d.innerText = c.nombre;
        d.onclick = () => { document.getElementById('input-calle').value = c.nombre; list.style.display='none'; map.fitBounds(c.bounds); };
        list.appendChild(d);
    });
    list.style.display = filtered.length ? 'block' : 'none';
}

function buscarPM() {
    var v = document.getElementById('input-pm').value.trim();
    if (!v) return;
    parcelasLayers.forEach(ly => ly.eachLayer(l => {
        if (String(l.feature.properties.nropasd) === v || String(l.feature.properties.nropar) === v) {
            map.fitBounds(l.getBounds(), { maxZoom: 19 });
            l.openPopup();
        }
    }));
}
</script>
</body>
</html>
