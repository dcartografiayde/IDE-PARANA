<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Urbano Paraná</title>

    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Plugins adicionales -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-textpath@1.2.3/leaflet.textpath.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <style>
        body { margin:0; padding:0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; background:#001a33; }

        .panel-superior {
            position:absolute; top:15px; left:60px; z-index:2000;
            background:white; padding:12px; border-radius:8px;
            box-shadow:0 4px 15px rgba(0,0,0,0.3);
            display:flex; gap:10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .etiqueta-distrito {
            background:rgba(255,255,255,0.8)!important;
            border:1.5px solid #d35400!important;
            border-radius:4px!important;
            padding:2px 5px!important;
            font-size:11px!important;
            font-weight:bold!important;
            color:#d35400!important;
        }

        .etiqueta-loteo-nro {
            background: rgba(0,0,0,0.75);
            border: 1px solid white;
            color: #00FF00;
            font-weight: bold;
            font-size: 11px;
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
        }

        .btn-streetview, .btn-gemini {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-streetview { background-color: #4285F4; color: white !important; }
        .btn-gemini { background-color: #8e44ad; color: white !important; margin-left: 5px; }

        .layer-legend-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border: 1px solid #333;
            vertical-align: middle;
        }
        .icon-line { height: 3px; border: none; }

        .popup-loteo, .popup-parcela { font-size: 12px; line-height: 1.4; max-height: 350px; min-width: 250px; overflow-y: auto; }
        .popup-loteo b, .popup-parcela b { color: #2c3e50; }
        
        .table-info { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .table-info td { border-bottom: 1px solid #eee; padding: 4px 0; font-size: 11px; }
        .table-info tr td:first-child { font-weight: bold; padding-right: 10px; color: #555; white-space: nowrap; }

        /* Gemini AI Assistant Styles */
        .gemini-chat-container {
            position: absolute; bottom: 20px; right: 20px; z-index: 3000;
            width: 350px; background: white; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; overflow: hidden;
            transition: height 0.3s ease; height: 450px;
        }
        .gemini-chat-container.minimized { height: 45px; }
        .gemini-header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white; padding: 12px; font-weight: bold; display: flex;
            justify-content: space-between; cursor: pointer; align-items: center;
        }
        .gemini-messages {
            flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;
            background: #f8f9fa; font-size: 13px;
        }
        .message { padding: 8px 12px; border-radius: 12px; max-width: 85%; }
        .message.ai { background: #e9ecef; align-self: flex-start; color: #333; }
        .message.user { background: #2575fc; align-self: flex-end; color: white; }
        .gemini-input-area { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #eee; }
        .gemini-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 6px 12px; outline: none; }
        .gemini-send { background: #2575fc; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
        
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: ' .'; } 40% { content: ' ..'; } 60% { content: ' ...'; } 80%, 100% { content: ''; } }
    </style>
</head>

<body>

<div class="panel-superior">
    <input type="text" id="input-pm" placeholder="Partida Municipal" style="width:140px; padding:6px; border: 1px solid #ccc; border-radius: 4px;">
    <button onclick="buscarPM()" style="padding:6px 12px; cursor:pointer; background:#2980b9; color:white; border:none; border-radius:4px;">Buscar</button>
    <select id="filtro-distrito" onchange="filtrarDistritos()" style="padding:6px; border-radius: 4px;">
        <option value="todos">-- Todos los Distritos --</option>
    </select>
    <button onclick="abrirStreetViewCentro()" style="padding:6px 10px; background:#fbbc05; border:1px solid #e2a900; border-radius:4px; cursor:pointer;" title="Ver Street View del centro del mapa">
        📍 SV
    </button>
</div>

<!-- Gemini AI Assistant Interface -->
<div id="gemini-assistant" class="gemini-chat-container">
    <div class="gemini-header" onclick="toggleChat()">
        <span>✨ Asistente Urbano</span>
        <span id="toggle-icon">▼</span>
    </div>
    <div id="gemini-messages" class="gemini-messages">
        <div class="message ai">¡Hola! Soy tu asistente con IA para Paraná. Puedo ayudarte a analizar parcelas, explicar zonificaciones o responder dudas urbanas.</div>
    </div>
    <div class="gemini-input-area">
        <input type="text" id="gemini-input" class="gemini-input" placeholder="Pregunta algo sobre la ciudad...">
        <button onclick="sendMessage()" class="gemini-send">></button>
    </div>
</div>

<div id="map"></div>

<script>
// API Gemini Configuration
const apiKey = ""; // La plataforma provee la key automáticamente
const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";

// URL base apuntando al repositorio principal para descargar archivos RAW
const BASE_URL = "https://raw.githubusercontent.com/dcartografiayde/IDE-PARANA/main/";

/* ================= CONFIGURACIÓN MAPA ================= */
var map = L.map('map',{
    center:[-31.745, -60.51], 
    zoom:13, 
});

var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
var ref = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}');
var hibrido = L.layerGroup([sat,ref]).addTo(map);

/* ================= FUNCIONES AUXILIARES ================= */
function getStreetViewLink(lat, lng) {
    return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;
}

function abrirStreetViewCentro() {
    const centro = map.getCenter();
    window.open(getStreetViewLink(centro.lat, centro.lng), '_blank');
}

function getColor(d){
    var colors=['#e6194b','#3cb44b','#ffe119','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6','#fabebe','#008080'];
    var hash=0;
    if(!d) return '#ccc';
    for(var i=0;i<d.length;i++){ hash=d.charCodeAt(i)+((hash<<5)-hash); }
    return colors[Math.abs(hash)%colors.length];
}

function getLineLength(layer) {
    try {
        var latlngs = layer.getLatLngs();
        if (latlngs.length > 0 && Array.isArray(latlngs[0])) { latlngs = latlngs.flat(2); }
        var distance = 0;
        for (var i = 0; i < latlngs.length - 1; i++) {
            if (latlngs[i] && latlngs[i+1]) { distance += latlngs[i].distanceTo(latlngs[i+1]); }
        }
        return distance;
    } catch (e) { return 0; }
}

/* ================= GEMINI API INTEGRATION ================= */

async function callGemini(prompt, systemInstruction = "") {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
    const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] }
    };

    let delay = 1000;
    for (let i = 0; i < 5; i++) {
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error('API Error');
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "Lo siento, no pude procesar la respuesta.";
        } catch (error) {
            if (i === 4) return "Error de conexión persistente con el servicio de IA.";
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
        }
    }
}

function toggleChat() {
    const chat = document.getElementById('gemini-assistant');
    chat.classList.toggle('minimized');
    document.getElementById('toggle-icon').innerText = chat.classList.contains('minimized') ? '▲' : '▼';
}

async function sendMessage() {
    const input = document.getElementById('gemini-input');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';

    const loadingId = 'loading-' + Date.now();
    addMessage('Pensando...', 'ai', loadingId);

    const systemPrompt = "Eres un Asistente Urbano experto para la ciudad de Paraná, Entre Ríos. Ayudas a los ciudadanos a entender el catastro y la planificación urbana. Sé amable, conciso y profesional.";
    const response = await callGemini(text, systemPrompt);
    
    document.getElementById(loadingId).innerText = response;
}

function addMessage(text, sender, id = null) {
    const container = document.getElementById('gemini-messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    if (id) msgDiv.id = id;
    msgDiv.innerText = text;
    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
}

async function analizarParcelaAI(partida, datosStr) {
    const container = document.getElementById('gemini-assistant');
    if (container.classList.contains('minimized')) toggleChat();
    
    addMessage(`✨ Solicitando análisis para partida ${partida}...`, 'user');
    
    const loadingId = 'loading-analisis-' + Date.now();
    addMessage('Generando informe de potencial...', 'ai', loadingId);

    const prompt = `Analiza los siguientes datos catastrales de una parcela en Paraná y genera un informe breve sobre su potencial urbano o comercial. Datos: ${datosStr}`;
    const systemPrompt = "Eres un consultor inmobiliario y urbanístico experto en Paraná. Tu objetivo es resaltar las ventajas competitivas y normativas de una propiedad según sus datos catastrales.";
    
    const response = await callGemini(prompt, systemPrompt);
    document.getElementById(loadingId).innerText = response;
}

/* ================= CAPA DISTRITOS ================= */
var lyDistritos;
var grupoDistritos = L.layerGroup().addTo(map);

fetch(BASE_URL + "distritos.geojson").then(r => r.json()).then(data => {
    lyDistritos = L.geoJSON(data, {
        style: f => ({ fillColor: getColor(f.properties.distrito), weight: 2.5, color: 'white', fillOpacity: 0.4 }),
        onEachFeature: (f, l) => {
            if (f.properties.distrito) {
                l.bindTooltip(f.properties.distrito, { permanent: true, className: 'etiqueta-distrito' });
                var sel = document.getElementById('filtro-distrito');
                if (!Array.from(sel.options).some(o => o.value === f.properties.distrito)) {
                    var opt = document.createElement('option');
                    opt.value = f.properties.distrito;
                    opt.text = f.properties.distrito;
                    sel.add(opt);
                }
            }
        }
    });
    grupoDistritos.addLayer(lyDistritos);
});

/* ================= CAPA MANZANAS ================= */
fetch(BASE_URL + "manzana.geojson").then(r => r.json()).then(data => {
    L.geoJSON(data, { style: { color: "#555", weight: 0.2, fillOpacity: 0.01 } }).addTo(map);
});

/* ================= CAPA CALLS ================= */
var grupoCalles = L.layerGroup().addTo(map);
var capasCalles = [];

fetch(BASE_URL + "calles.geojson").then(r => r.json()).then(data => {
    L.geoJSON(data, {
        renderer: L.svg(), 
        style: { color: "#333", weight: 2, opacity: 0.02 }, 
        onEachFeature: (f, l) => {
            if (f.properties.nombre && l instanceof L.Polyline) {
                var len = getLineLength(l);
                capasCalles.push({ layer: l, nombre: f.properties.nombre, length: len });
                l.on('click', function(e) {
                    var svUrl = getStreetViewLink(e.latlng.lat, e.latlng.lng);
                    l.bindPopup(`<b>Calle:</b> ${f.properties.nombre}<br><a href="${svUrl}" target="_blank" class="btn-streetview">Ver Street View</a>`).openPopup();
                });
            }
        }
    }).addTo(grupoCalles);
    capasCalles.sort((a, b) => b.length - a.length);
    setTimeout(actualizarTextosCalles, 800);
});

function actualizarTextosCalles() {
    var zoomActual = map.getZoom();
    const bounds = map.getBounds();
    const nombresProcesados = new Set();
    const MIN_ZOOM_VIEW = 15; 
    const MAX_ETIQUETAS_PANTALLA = 120; 
    var contador = 0;

    capasCalles.forEach(item => {
        var l = item.layer;
        if (l._text) { try { l.setText(null); } catch(e){} }
        var nombreNorm = item.nombre.trim().toUpperCase();
        var estaEnPantalla = bounds.intersects(l.getBounds());
        var minLengthRequired = zoomActual >= 18 ? 15 : (zoomActual >= 17 ? 40 : 80);
        var cumpleFiltros = zoomActual >= MIN_ZOOM_VIEW && item.length > minLengthRequired && contador < MAX_ETIQUETAS_PANTALLA && !nombresProcesados.has(nombreNorm);

        if (estaEnPantalla && cumpleFiltros) {
            nombresProcesados.add(nombreNorm);
            try {
                l.setText(item.nombre, {
                    repeat: false, center: true, offset: 0, orientation: 'flip', 
                    attributes: { 
                        fill: '#FFFF00', 'font-size': zoomActual >= 18 ? '14' : '11', 
                        'font-weight': 'bold', 'stroke': 'black', 'stroke-width': '2.5px',
                        'paint-order': 'stroke', 'text-transform': 'uppercase'
                    }
                });
                contador++;
            } catch (err) {}
        }
    });
}
map.on('zoomend moveend', actualizarTextosCalles);

/* ================= PARCELAS (CATASTRO) ================= */
var parcelasLayers = [];
var grupoParcelas = L.layerGroup();

// Función que define el contenido del popup basado en el estado
function getParcelaPopupContent(f, latlng) {
    const props = f.properties;
    const svUrl = getStreetViewLink(latlng.lat, latlng.lng);
    const estado = props.estado_original ? props.estado_original.toString().trim().toUpperCase() : "";
    const partidaPrincipal = props.partidas[0] || "S/D";
    const datosIA = JSON.stringify(props.full_data || props);

    let html = `<div class="popup-parcela">`;
    
    // Si el estado es E o B, mostramos TODOS los campos del GeoJSON original
    if (estado === "E" || estado === "B") {
        html += `<center><b>DETALLE CATASTRAL (Estado ${estado})</b></center><hr>`;
        html += `<table class="table-info">`;
        for (let key in props.full_data) {
            let val = props.full_data[key];
            if (val !== null && val !== undefined && typeof val !== 'object') {
                html += `<tr><td>${key.toUpperCase()}</td><td>${val}</td></tr>`;
            }
        }
        html += `</table>`;
    } 
    // Para estado H u otros, mostramos información resumida
    else {
        html += `<center><b>INFORMACIÓN PARCELARIA</b></center><hr>`;
        if (props.esPH) {
            html += `<b>TIPO:</b> UNIDAD PH<br><b>PARTIDAS:</b><br>${props.partidas.join("<br>")}`;
        } else {
            html += `<b>PARTIDA:</b> ${props.partidas[0] || "No disponible"}`;
        }
        html += `<br><b>UBICACIÓN:</b> ${props.ubicacion || "-"}`;
        html += `<br><b>ESTADO:</b> ${estado || "-"}`;
    }

    html += `<div style="display:flex; justify-content:center; gap:5px;">`;
    html += `<a href="${svUrl}" target="_blank" class="btn-streetview">📍 SV</a>`;
    html += `<button onclick='analizarParcelaAI("${partidaPrincipal}", ${JSON.stringify(datosIA)})' class="btn-gemini">✨ IA Info</button>`;
    html += `</div>`;
    html += `</div>`;
    return html;
}

// Lista de archivos en la carpeta 'catastro'
const archivosCatastro = ["parcela1_4.geojson", "parcela5_7.geojson", "parcela8_15.geojson"];

archivosCatastro.forEach(nombre => {
    const path = BASE_URL + "catastro/" + nombre;
    
    fetch(path)
        .then(res => {
            if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
            return res.json();
        })
        .then(data => {
            // Agrupamos geometrías idénticas para detectar PHs (Propiedad Horizontal)
            var grupos = {};
            data.features.forEach(f => {
                var key = JSON.stringify(f.geometry.coordinates);
                if (!grupos[key]) grupos[key] = [];
                grupos[key].push(f);
            });

            var featuresAgrupadas = Object.values(grupos).map(grupo => {
                var base = grupo[0];
                return {
                    type: "Feature", 
                    geometry: base.geometry,
                    properties: { 
                        esPH: grupo.length > 1, 
                        partidas: grupo.map(g => g.properties.nropasd), 
                        ubicacion: base.properties.ubipar1,
                        estado_original: base.properties.estado || "",
                        full_data: base.properties 
                    }
                };
            });

            var layer = L.geoJSON(featuresAgrupadas, {
                style: f => ({ 
                    color: f.properties.esPH ? "#8e44ad" : "#2980b9", 
                    weight: f.properties.esPH ? 1.5 : 0.6, 
                    fillOpacity: f.properties.esPH ? 0.3 : 0.1 
                }),
                onEachFeature: (f, l) => {
                    l.on('click', function(e) {
                        l.bindPopup(getParcelaPopupContent(f, e.latlng)).openPopup();
                    });
                }
            });
            
            layer.eachLayer(l => l.bringToBack());
            parcelasLayers.push(layer);
            grupoParcelas.addLayer(layer);
        })
        .catch(err => console.error("Error cargando capa:", nombre, err));
});

/* ================= CAPAS DE LOTEOS ================= */
var grupoLoteosPrivadosHabilitados = L.layerGroup();
var grupoLoteosPrivadosAprobados = L.layerGroup();
var grupoLoteosSinOrdenanza = L.layerGroup();
var grupoLoteosPrivadosInfoAdicional = L.layerGroup();
var grupoIAPV = L.layerGroup();

var loteoTooltips = [];

function popupLoteos(f, titulo, latlng) {
    let p = f.properties;
    let svUrl = latlng ? getStreetViewLink(latlng.lat, latlng.lng) : null;
    return `<div class="popup-loteo">
        <center><b>LOTEO ${titulo.toUpperCase()}</b></center><hr>
        <b>NRO:</b> ${p.nro || p.nro_ref || "-"}<br>
        <b>PROPIETARIO:</b> ${p.propietario || "-"}<br>
        <b>ORDENANZA:</b> ${p.ordenanza || p["ord.año"] || "-"}<br>
        <b>EXPEDIENTE:</b> ${p.expte || p.exp_s_cat || "-"} / ${p.anio || "-"}<br>
        <b>TRAMITE:</b> ${p.tramite || "-"}<br>
        <b>ESTADO:</b> ${p.etiqueta || "-"}<br>
        ${svUrl ? `<center><a href="${svUrl}" target="_blank" class="btn-streetview">Street View</a></center>` : ''}
    </div>`;
}

const configLoteos = [
    { file: "backdoor/loteos_privados_habilitados.geojson", grupo: grupoLoteosPrivadosHabilitados, color: "#39FF14", titulo: "Habilitado", label: true },
    { file: "backdoor/loteos_privados_aprobados.geojson", grupo: grupoLoteosPrivadosAprobados, color: "#FFFF33", titulo: "Aprobado", label: true },
    { file: "backdoor/loteos_sin_ordenanza.geojson", grupo: grupoLoteosSinOrdenanza, color: "#FF00FF", titulo: "Sin Ordenanza", label: true },
    { file: "backdoor/loteos_privados.geojson", grupo: grupoLoteosPrivadosInfoAdicional, color: "#00FFFF", titulo: "Info Adicional", label: false }
];

configLoteos.forEach(item => {
    fetch(BASE_URL + item.file).then(r => r.json()).then(data => {
        L.geoJSON(data, {
            style: { color: item.color, weight: 2.5, fillColor: item.color, fillOpacity: 0.25 },
            onEachFeature: (f,l) => {
                if (item.label) {
                    var nroVal = f.properties.nro || f.properties.nro_ref || "";
                    if (nroVal) {
                        l.bindTooltip(String(nroVal), { permanent: true, direction: 'center', className: 'etiqueta-loteo-nro', opacity: 0.9 });
                        loteoTooltips.push(l);
                    }
                }
                l.on('click', function(e) { l.bindPopup(popupLoteos(f, item.titulo, e.latlng)).openPopup(); });
            }
        }).addTo(item.grupo);
    });
});

/* ================= OTRAS CAPAS ================= */
fetch(BASE_URL + "iapv.geojson").then(r => r.json()).then(data => {
    L.geoJSON(data, {
        style: { color: "#FF4500", weight: 2, fillColor: "#FF4500", fillOpacity: 0.3 },
        onEachFeature: (f, l) => l.bindPopup("<b>IAPV</b><br>" + (f.properties.barrio || "-"))
    }).addTo(grupoIAPV);
});

var grupoCocherasZonificacion = L.layerGroup();
fetch(BASE_URL + "cocheras_porcentaje_zona.geojson").then(r => r.json()).then(data => {
    function getZC(p){ return p >= 20 ? "#4a148c" : p >= 15 ? "#7b1fa2" : "#ce93d8"; }
    L.geoJSON(data, {
        style: f => ({ color: "#000", weight: 2, fillColor: getZC(parseFloat(f.properties.porcentaje)||0), fillOpacity: 0.5 }),
        onEachFeature: (f, l) => { l.bindPopup("<b>Zonificación Cocheras</b><br>" + f.properties.porcentaje + "%"); }
    }).addTo(grupoCocherasZonificacion);
});

/* ================= CONTROL DE CAPAS ================= */
function createLayerLabel(color, name, isLine = false) {
    const typeClass = isLine ? 'layer-legend-icon icon-line' : 'layer-legend-icon';
    return `<span class="${typeClass}" style="background-color: ${color}; border: 1px solid #fff;"></span>${name}`;
}

const baseLayers = { "Satélite (Híbrido)": hibrido, "OpenStreetMap": osm };
const overlays = {
    [createLayerLabel('#d35400', 'Distritos Municipales')]: grupoDistritos,
    [createLayerLabel('#FFFF00', 'Nombres de Calles', true)]: grupoCalles,
    [createLayerLabel('#2980b9', 'Parcelas Catastrales')]: grupoParcelas,
    [createLayerLabel('#7b1fa2', 'Zonificación Cocheras')]: grupoCocherasZonificacion,
    [createLayerLabel('#39FF14', 'Loteos Habilitados')]: grupoLoteosPrivadosHabilitados,
    [createLayerLabel('#FFFF33', 'Loteos Aprobados')]: grupoLoteosPrivadosAprobados,
    [createLayerLabel('#FF00FF', 'Loteos Sin Ordenanza')]: grupoLoteosSinOrdenanza,
    [createLayerLabel('#FF4500', 'Barrios IAPV')]: grupoIAPV
};

L.control.layers(baseLayers, overlays).addTo(map);
L.Control.geocoder({ position: 'topright', placeholder: 'Buscar dirección...' }).addTo(map);

/* ================= SISTEMA DE BÚSQUEDA POR PM ================= */
function buscarPM() {
    var val = document.getElementById('input-pm').value.trim();
    if (!val) return;
    
    // Aseguramos que la capa de parcelas esté visible
    if (!map.hasLayer(grupoParcelas)) grupoParcelas.addTo(map);
    
    let encontrado = false;
    parcelasLayers.forEach(layer => {
        layer.eachLayer(l => {
            var partidas = (l.feature.properties.partidas || []).map(String);
            if (partidas.includes(val)) {
                map.fitBounds(l.getBounds(), { maxZoom: 18 });
                l.openPopup();
                encontrado = true;
            }
        });
    });
    
    if (!encontrado) console.log("Partida no encontrada en las capas cargadas.");
}

function filtrarDistritos() {
    var val = document.getElementById('filtro-distrito').value;
    if (!lyDistritos) return;
    lyDistritos.eachLayer(l => {
        var visible = (val === "todos" || l.feature.properties.distrito === val);
        l.setStyle({ opacity: visible ? 1 : 0, fillOpacity: visible ? 0.4 : 0 });
        if (l.getTooltip()) l.getTooltip().setOpacity(visible ? 0.9 : 0);
    });
}

// Enter listener for Gemini input
document.getElementById('gemini-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') sendMessage();
});
