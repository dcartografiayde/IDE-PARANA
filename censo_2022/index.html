<script>
const BASE_URL = "https://raw.githubusercontent.com/dcartografiayde/IDE-PARANA/main/";

/* ================= FUNCIONES DE LIMPIEZA Y DECODIFICACIÓN DE TEXTO ================= */
function decodificarTexto(str) {
    if (!str || typeof str !== 'string') return str;
    try {
        const correcciones = {
            'Ã¡': 'á', 'Ã©': 'é', 'Ã­': 'í', 'Ã³': 'ó', 'Ãº': 'ú',
            'Ã ': 'Á', 'Ã‰': 'É', 'Ã ': 'Í', 'Ã“': 'Ó', 'Ãš': 'Ú',
            'Ãñ': 'ñ', 'Ã‘': 'Ñ', 'Â°': '°', 'Ã¼': 'ü', 'Â¿': '¿'
        };
        let textoCorregido = str;
        for (let mal in correcciones) {
            textoCorregido = textoCorregido.split(mal).join(correcciones[mal]);
        }

        const reemplazosClave = [
            { mal: /TORRE[ïÏ]¿½N/gi, bien: 'TORREÓN' },
            { mal: /Torre[ïÏ]¿½n/gi, bien: 'Torreón' },
            { mal: /APROBACI[ïÏ]¿½N/gi, bien: 'APROBACIÓN' },
            { mal: /Aprobaci[ïÏ]¿½n/gi, bien: 'Aprobación' },
            { mal: /ASOCIACI[ïÏ]¿½N/gi, bien: 'ASOCIACIÓN' },
            { mal: /Asociaci[ïÏ]¿½n/gi, bien: 'Asociación' },
            { mal: /CONSTITUCI[ïÏ]¿½N/gi, bien: 'CONSTITUCIÓN' },
            { mal: /Constituci[ïÏ]¿½n/gi, bien: 'Constitución' },
            { mal: /DECLARACI[ïÏ]¿½N/gi, bien: 'DECLARACIÓN' },
            { mal: /Declaraci[ïÏ]¿½n/gi, bien: 'Declaración' },
            { mal: /URBANIZACI[ïÏ]¿½N/gi, bien: 'URBANIZACIÓN' },
            { mal: /Urbanizaci[ïÏ]¿½n/gi, bien: 'Urbanización' },
            { mal: /PROLONGACI[ïÏ]¿½N/gi, bien: 'PROLONGACIÓN' },
            { mal: /Prolongaci[ïÏ]¿½n/gi, bien: 'Prolongación' },
            { mal: /SECCI[ïÏ]¿½N/gi, bien: 'SECCIÓN' },
            { mal: /Secci[ïÏ]¿½n/gi, bien: 'Sección' },
            { mal: /ESTACI[ïÏ]¿½N/gi, bien: 'ESTACIÓN' },
            { mal: /Estaci[ïÏ]¿½n/gi, bien: 'Estación' },
            { mal: /REVOLUCI[ïÏ]¿½N/gi, bien: 'REVOLUCIÓN' },
            { mal: /Revoluci[ïÏ]¿½n/gi, bien: 'Revolución' },
            { mal: /N[ïÏ]¿½/g, bien: 'Nº' },
            { mal: /n[ïÏ]¿½/g, bien: 'nº' },
            { mal: /PARAN[ïÏ]¿½/gi, bien: 'PARANÁ' },
            { mal: /Paran[ïÏ]¿½/gi, bien: 'Paraná' },
            { mal: /CI[ïÏ]¿½N/g, bien: 'CIÓN' },
            { mal: /ci[ïÏ]¿½n/g, bien: 'ción' }
        ];

        for (let r of reemplazosClave) {
            textoCorregido = textoCorregido.replace(r.mal, r.bien);
        }

        return textoCorregido;
    } catch (e) { return str; }
}

async function fetchGeoJSON(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    const arrayBuffer = await response.arrayBuffer();
    
    const decoderUTF8 = new TextDecoder('utf-8');
    let text = decoderUTF8.decode(arrayBuffer);
    
    if (text.includes('\uFFFD')) {
        const decoderANSI = new TextDecoder('windows-1252');
        text = decoderANSI.decode(arrayBuffer);
    }
    return JSON.parse(text);
}

// Inicio del mapa en Zoom 12 (vista completa de la ciudad)
var map = L.map('map', { 
    center: [-31.745, -60.51], 
    zoom: 12, 
    zoomControl: true,
    maxZoom: 22
});

// Creación explícita de paneles ordenados por Z-Index
map.createPane('manzanasPane');
map.getPane('manzanasPane').style.zIndex = 300; // Capa inferior de fondo
map.getPane('manzanasPane').style.pointerEvents = 'none'; // Clics pasan de largo

var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22, maxNativeZoom: 19 });
var dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 22, maxNativeZoom: 20 });
var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 22, maxNativeZoom: 18 });
var ref = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 22, maxNativeZoom: 18 });
var hibrido = L.layerGroup([sat, ref]);

dark.addTo(map);

// Calles cargadas asíncronamente
var grupoCalles = L.layerGroup();
var listaCallesParaBusqueda = [];

fetchGeoJSON(BASE_URL + "calles.geojson").then(data => {
    L.geoJSON(data, {
        style: { color: "#FFFF00", weight: 6, opacity: 0.01 },
        onEachFeature: (f, l) => {
            if (f.properties.nombre) {
                let nombreCalle = decodificarTexto(f.properties.nombre);
                listaCallesParaBusqueda.push({ nombre: nombreCalle.toUpperCase(), layer: l });
                l.on('click', (e) => {
                    let latlng = e.latlng || l.getBounds().getCenter();
                    let sv = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${latlng.lat},${latlng.lng}`;
                    l.bindPopup(`<b>Calle:</b> ${nombreCalle.toUpperCase()}<br><a href="${sv}" target="_blank" class="btn-streetview">📍 STREET VIEW</a>`).openPopup();
                });
            }
        }
    }).addTo(grupoCalles);
    configurarBuscadorCalles();
    activarEtiquetasCalles();
});

function activarEtiquetasCalles() {
    const renderLabels = () => {
        let z = map.getZoom();
        const activeOnMap = map.hasLayer(grupoCalles);
        let etiquetasColocadas = {}; 

        grupoCalles.eachLayer(geoJsonGroup => {
            geoJsonGroup.eachLayer(ly => {
                if (ly.setText) {
                    try {
                        ly.setText(null);
                    } catch (e) {}

                    if (activeOnMap && z >= 16 && ly._map && ly._renderer && ly.feature && ly.feature.properties.nombre) {
                        try {
                            if (map.getBounds().intersects(ly.getBounds())) {
                                let nombreCalle = decodificarTexto(ly.feature.properties.nombre).toUpperCase();
                                let latlngs = ly.getLatLngs();
                                if (Array.isArray(latlngs[0])) latlngs = latlngs.flat(2);
                                
                                let largoMetros = 0;
                                for (let i = 0; i < latlngs.length - 1; i++) {
                                    if (latlngs[i] && latlngs[i+1]) {
                                        largoMetros += latlngs[i].distanceTo(latlngs[i+1]);
                                    }
                                }

                                if (largoMetros < 70) return;

                                let centro = ly.getBounds().getCenter();
                                let duplicadoCercano = false;
                                if (etiquetasColocadas[nombreCalle]) {
                                    for (let pt of etiquetasColocadas[nombreCalle]) {
                                        if (centro.distanceTo(pt) < 200) {
                                            duplicadoCercano = true;
                                            break;
                                        }
                                    }
                                }

                                if (!duplicadoCercano) {
                                    if (!etiquetasColocadas[nombreCalle]) {
                                        etiquetasColocadas[nombreCalle] = [];
                                    }
                                    etiquetasColocadas[nombreCalle].push(centro);

                                    ly.setText(nombreCalle, {
                                        repeat: false,
                                        center: true, 
                                        orientation: 'flip',
                                        offset: 0,
                                        attributes: { 
                                            fill: '#FFFF00', 
                                            'font-weight': 'bold', 
                                            'font-size': z >= 18 ? '13' : '10',
                                            'stroke': 'black', 
                                            'stroke-width': '2px', 
                                            'paint-order': 'stroke'
                                        }
                                    });
                                }
                            }
                        } catch (err) {}
                    }
                }
            });
        });
    };

    map.on('zoomend moveend', renderLabels);
    map.on('layeradd layerremove', (e) => {
        if (e.layer === grupoCalles) {
            renderLabels();
        }
    });
    renderLabels();
}

// Capa de Manzanas
var grupoManzanas = L.layerGroup().addTo(map);
var grupoEtiquetasManzanas = L.layerGroup(); 

fetchGeoJSON(BASE_URL + "catastro/manzana.geojson").then(data => {
    const manzanasEtiquetadas = new Set();

    L.geoJSON(data, {
        pane: 'manzanasPane', 
        filter: (f) => f && f.geometry && f.geometry.coordinates && f.geometry.coordinates.length > 0,
        style: {
            color: "#ff6b6b", 
            weight: 1, // MODIFICACIÓN: Grosor reducido para alivianar visualmente el mapa        
            fillColor: "transparent",
            fillOpacity: 0,
            interactive: false 
        },
        onEachFeature: (f, l) => {
            let propNum = "";
            for (let k in f.properties) {
                let kLower = k.toLowerCase();
                if (kLower.includes("manz") || kLower === "nro" || kLower === "num" || kLower.includes("mza")) {
                    propNum = f.properties[k];
                    break;
                }
            }
            if (!propNum && f.properties.nropasd) propNum = f.properties.nropasd; 

            if (propNum) {
                const numStr = String(propNum).trim();
                if (!manzanasEtiquetadas.has(numStr)) {
                    manzanasEtiquetadas.add(numStr);
                    try {
                        let center = l.getBounds().getCenter();
                        L.marker(center, {
                            icon: L.divIcon({
                                className: 'etiqueta-manzana',

                                iconSize: [24, 24]
                            }),
                            interactive: false 
                        }).addTo(grupoEtiquetasManzanas); 
                    } catch(e) {}
                }
            }
        }
    }).addTo(grupoManzanas);
    controlarVisibilidadDinamica(); 
}).catch(err => {
    console.error("Error al cargar la capa de manzanas:", err);
});

/* ================= CÁLCULO GEOMÉTRICO DE ÁREAS (HECTÁREAS) ================= */
function calcularAreaHectareas(coordinates, type) {
    let areaM2 = 0;
    const R = 6371000; // Radio medio de la Tierra en metros
    
    function ringArea(coords) {
        let area = 0;
        if (coords.length > 2) {
            for (let i = 0; i < coords.length - 1; i++) {
                let p1 = coords[i];
                let p2 = coords[i + 1];
                let x1 = p1[0] * Math.PI / 180 * Math.cos(-31.74 * Math.PI / 180) * R;
                let y1 = p1[1] * Math.PI / 180 * R;
                let x2 = p2[0] * Math.PI / 180 * Math.cos(-31.74 * Math.PI / 180) * R;
                let y2 = p2[1] * Math.PI / 180 * R;
                area += (x1 * y2 - x2 * y1);
            }
            area = Math.abs(area / 2);
        }
        return area;
    }

    if (type === "Polygon") {
        areaM2 = ringArea(coordinates[0]);
    } else if (type === "MultiPolygon") {
        coordinates.forEach(poly => {
            if (poly && poly[0]) areaM2 += ringArea(poly[0]);
        });
    }
    return areaM2 / 10000; // Convertir m² a Hectáreas
}

function getColorDensity(d) {
    return d > 150 ? '#084594' : // Azul muy oscuro (Densidad extrema)
           d > 100 ? '#2171b5' : 
           d > 50  ? '#4292c6' : 
           d > 20  ? '#6baed6' : 
           d > 5   ? '#9ecae1' : 
           d > 0   ? '#c6dbef' : 
                     '#eff3ff'; // Densidad prácticamente nula / deshabitado
}

/* ================= NORMALIZACIÓN ROBUSTA DE LLAVES Y VALORES PARA EL CENSO ================= */

function normalizarKey(str) {
    if (!str) return '';
    return str.toString()
        .toUpperCase()
        .replace(/Ã‘/g, 'Ñ')
        .replace(/Ã/g, 'Ñ')
        .replace(/Ã³/g, 'Ó')
        .replace(/Ã¡/g, 'Á')
        .replace(/Ã©/g, 'É')
        .replace(/Ã­/g, 'Í')
        .replace(/Ãº/g, 'Ú')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "") // Remueve acentos y diacríticos
        .replace(/[^A-Z0-9]/g, ""); // Conserva solo caracteres alfanuméricos
}

function getPropValue(properties, targetKey) {
    if (!properties) return undefined;
    // Normaliza clave objetivo mapeando ceros por letras 'O'
    const targetNorm = normalizarKey(targetKey).replace(/0/g, 'O');
    
    for (let k in properties) {
        let kNorm = normalizarKey(k).replace(/0/g, 'O');
        if (kNorm === targetNorm) {
            return properties[k];
        }
        // Búsqueda aproximada si el nombre es lo suficientemente característico
        if (targetNorm.length > 5 && (kNorm.includes(targetNorm) || targetNorm.includes(kNorm))) {
            return properties[k];
        }
    }
    return undefined;
}

function parseValue(val) {
    if (val === undefined || val === null) return 0;
    if (typeof val === 'number') return val;
    let str = String(val).trim();
    if (str === '' || str === '-') return 0;
    
    // Tratamiento de formatos decimales/miles españoles y anglosajones
    if (str.includes('.') && str.includes(',')) {
        str = str.replace(/\./g, '').replace(/,/g, '.');
    } else if (str.includes(',')) {
        str = str.replace(/,/g, '.');
    } else if (str.includes('.')) {
        // En datos demográficos enteros de Paraná, un punto (ej. "1.234") representa miles
        if ((str.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(str)) {
            str = str.replace(/\./g, '');
        }
    }
    
    let num = parseFloat(str);
    return isNaN(num) ? 0 : num;
}

/* ================= CAPA CENSO 2022 INTEGRADA ================= */
var grupoCenso = L.layerGroup().addTo(map);

fetchGeoJSON(BASE_URL + "censo_2022/censo_2022.geojson").then(data => {
    L.geoJSON(data, {
        style: (feature) => {
            let p = feature.properties;
            
            // Usamos extractor robusto inmune a fallos de encoding
            let valPob = getPropValue(p, "POBLACI0N TOTAL EN HOGARES PARTICULARES");
            let pob = parseValue(valPob);
            
            // Cálculo dinámico de área y densidad por hectárea
            let areaHectareas = calcularAreaHectareas(feature.geometry.coordinates, feature.geometry.type);
            let densidad = areaHectareas > 0 ? (pob / areaHectareas) : 0;

            return {
                fillColor: getColorDensity(densidad),
                fillOpacity: 0.65,
                color: "#1d4ed8", // Borde azul grueso y nítido
                weight: 2, 
                opacity: 0.95
            };
        },
        onEachFeature: (f, l) => {
            let p = f.properties;
            
            // Extracción robusta para visualización en pop-up
            let valPob = getPropValue(p, "POBLACI0N TOTAL EN HOGARES PARTICULARES");
            let pob = parseValue(valPob);
            
            let areaHectareas = calcularAreaHectareas(f.geometry.coordinates, f.geometry.type);
            let densidad = areaHectareas > 0 ? (pob / areaHectareas) : 0;

            // Popup estructurado e impecable
            let html = `<div class="popup-custom">`;
            html += `<div class="popup-header">Censo 2022 - Datos de Fracción</div>`;
            html += `<table class="table-info">`;
            html += `<tr><td>DENSIDAD CALCULADA</td><td><b>${densidad.toFixed(2)} hab/ha</b></td></tr>`;
            html += `<tr><td>SUPERFICIE ESTIMADA</td><td>${areaHectareas.toFixed(2)} ha</td></tr>`;
            
            for (let [k, v] of Object.entries(p)) {
                let keySanitized = decodificarTexto(k).replace("POBLACI0N", "POBLACIÓN");
                let valSanitized = decodificarTexto(String(v));
                html += `<tr><td>${keySanitized}</td><td>${valSanitized}</td></tr>`;
            }
            html += `</table></div>`;
            l.bindPopup(html, { maxWidth: 300 });
        }
    }).addTo(grupoCenso);

    // Ejecutar el primer cálculo de estadísticas
    actualizarEstadisticasVisibles();
}).catch(err => {
    console.error("Error cargando la capa Censo 2022:", err);
});

/* ================= CÁLCULO ESTADÍSTICO DINÁMICO POR VIEWPORT ================= */
function actualizarEstadisticasVisibles() {
    // Si la capa de censo no se encuentra activa en el mapa, indicamos al usuario
    if (!map.hasLayer(grupoCenso)) {
        document.getElementById('count-fracciones').innerText = `0 frac.`;
        document.getElementById('stats-content').innerHTML = `
            <div class="text-slate-500 py-3 text-center italic font-medium">
                Active la capa "Censo 2022" para ver estadísticas
            </div>`;
        return;
    }

    let bounds = map.getBounds();
    let totalStats = {
        "TOTAL VIVIENDAS PARTICULARES": 0,
        "CON PERSONAS PRESENTES": 0,
        "SIN PERSONAS PRESENTES": 0,
        "TOTAL HOGARES PARTICULARES": 0,
        "POBLACI0N TOTAL EN HOGARES PARTICULARES": 0,
        "MUJERES": 0,
        "VARONES": 0,
        "0 A 14 AÑOS": 0,
        "15 A 64 AÑOS": 0,
        "65 Y MAS AÑOS": 0
    };
    let countFracciones = 0;

    grupoCenso.eachLayer(geoJsonLayer => {
        if (geoJsonLayer.eachLayer) {
            geoJsonLayer.eachLayer(layer => {
                if (layer.getBounds && bounds.intersects(layer.getBounds())) {
                    let p = layer.feature.properties;
                    countFracciones++;
                    
                    // Suma exacta mediante extracción y formateo seguro de datos
                    for (let key in totalStats) {
                        let val = getPropValue(p, key);
                        if (val !== undefined && val !== null) {
                            totalStats[key] += parseValue(val);
                        }
                    }
                }
            });
        }
    });

    // Actualizar indicador de cantidad de fracciones contabilizadas
    document.getElementById('count-fracciones').innerText = `${countFracciones} frac.`;

    // Renderizar tabla estadística estructurada
    let html = `<table class="w-full text-[10px] text-slate-700">`;
    for (let [key, val] of Object.entries(totalStats)) {
        let label = key.replace("POBLACI0N", "POBLACIÓN");
        html += `
        <tr class="border-b border-slate-100 last:border-none">
            <td class="py-1 pr-2 font-medium">${label}</td>
            <td class="py-1 font-bold text-right text-slate-900">${Math.round(val).toLocaleString('es-AR')}</td>
        </tr>`;
    }
    html += `</table>`;
    document.getElementById('stats-content').innerHTML = html;
}

// Suscribir recálculo dinámico a movimientos de paneo y zoom del mapa
map.on('moveend', actualizarEstadisticasVisibles);
map.on('layeradd layerremove', (e) => {
    if (e.layer === grupoCenso) {
        actualizarEstadisticasVisibles();
    }
});

/* ================= GESTIÓN UNIFICADA DE VISIBILIDAD DINÁMICA POR ZOOM ================= */
function controlarVisibilidadDinamica() {
    let zoomActual = map.getZoom();
    document.getElementById('zoom-indicator').innerText = zoomActual;

    if (zoomActual >= 15 && map.hasLayer(grupoManzanas)) {
        if (!map.hasLayer(grupoEtiquetasManzanas)) {
            map.addLayer(grupoEtiquetasManzanas);
        }
    } else {
        if (map.hasLayer(grupoEtiquetasManzanas)) {
            map.removeLayer(grupoEtiquetasManzanas);
        }
    }

    if (zoomActual >= 15) {
        if (!map.hasLayer(grupoCalles)) {
            map.addLayer(grupoCalles);
        }
    } else {
        if (map.hasLayer(grupoCalles)) {
            map.removeLayer(grupoCalles);
        }
    }
}

map.on('zoomend', controlarVisibilidadDinamica);
map.on('layeradd layerremove', controlarVisibilidadDinamica); 

/* ================= CONTROLES Y BÚSQUEDA ================= */
function buscarDireccion() {
    let nom = document.getElementById('input-calle').value.toUpperCase().trim();
    let match = listaCallesParaBusqueda.find(c => c.nombre === nom);
    if (match) {
        map.fitBounds(match.layer.getBounds(), { maxZoom: 16 });
        match.layer.fire('click');
    }
}

function configurarBuscadorCalles() {
    const input = document.getElementById('input-calle');
    const sug = document.getElementById('sugerencias-calles');
    input.addEventListener('input', () => {
        let val = input.value.toUpperCase().trim();
        sug.innerHTML = '';
        if (val.length < 2) { sug.style.display = 'none'; return; }
        
        let exactPrefixMatches = [];
        let generalMatches = [];
        
        const uniqueNames = [...new Set(listaCallesParaBusqueda.map(c => c.nombre))];
        
        uniqueNames.forEach(n => {
            if (n.startsWith(val)) {
                exactPrefixMatches.push(n);
            } else if (n.includes(val)) {
                generalMatches.push(n);
            }
        });

        let matches = [...exactPrefixMatches, ...generalMatches].slice(0, 6);
        
        if (matches.length > 0) {
            sug.style.display = 'block';
            matches.forEach(m => {
                let d = document.createElement('div');
                d.className = 'sugerencia-item'; d.innerText = m;
                d.onclick = () => { input.value = m; sug.style.display = 'none'; buscarDireccion(); };
                sug.appendChild(d);
            });
        } else { sug.style.display = 'none'; }
    });

    document.addEventListener('click', (e) => {
        if (e.target !== input && e.target !== sug) sug.style.display = 'none';
    });
}

function buscarGoogle() {
    let val = document.getElementById('input-google').value.trim();
    if (!val) return;
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val + ", Paraná, Entre Ríos")}`)
        .then(r => r.json()).then(data => {
            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                map.setView([lat, lon], 18);
                L.marker([lat, lon]).addTo(map).bindPopup(`<b>Resultado Google:</b><br>${val}`).openPopup();
            }
        });
}

/* ================= LEYENDAS Y CONTROL DE CAPAS ================= */
const overlays = {
    "<span class='layer-legend-icon' style='background:rgba(8,81,156,0.6); border:2px solid #1d4ed8;'></span> Censo 2022 (por Densidad)": grupoCenso,
    "<span class='layer-legend-icon' style='background:rgba(255,107,107,0.15); border:1px solid #ff6b6b;'></span> Manzanas": grupoManzanas,
    "<span class='layer-legend-icon' style='background:#FFFF00; height:4px; border:1px solid #000;'></span> Nombres de Calles": grupoCalles
};

L.control.layers(
    { "Mapa Oscuro": dark, "Híbrido": hibrido, "OpenStreetMap": osm }, 
    overlays, 
    { collapsed: false }
).addTo(map);

controlarVisibilidadDinamica();
